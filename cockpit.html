/* ===== DSP fonoaudiológico (20 Hz) — estimativas acústicas de microfone ===== */
const med=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:0;
function mk(o){
  R.vz.push(o.voz?1:0);if(R.vz.length>40)R.vz.shift();
  const pros=med(R.vz),sil=1-med(R.vz.slice(-10));
  const R_=Math.min(3,o.jit/1),B_=Math.min(3,Math.max(0,(15-o.hnr)/5)),A_=Math.min(3,Math.max(0,(-42-o.db)/6)),S_=Math.min(3,Math.max(0,(o.cent-1800)/700)),G_=Math.min(3,(R_+B_+A_+S_)/4*1.6);
  const k=Object.assign({},o,{G:G_,Rr:R_,B:B_,As:A_,S:S_,pros,sil});
  if(o.voz)R.prev=rg(o.f0,70,400);
  k.n=[R.prev,rg(o.db,-70,-10),rg(o.hnr,0,30),pros,G_/3,o.flow,o.cq,rg(o.floor,-90,-30),rg(o.cent,200,4000),sil,0];
  k.n[10]=med(k.n.slice(0,8));return k
}
function demo(){const t=Date.now()/1000,voz=Math.sin(t*.55)>-.3,f0=150+25*Math.sin(t*.9)+8*Math.sin(t*3.1),db=voz?-34+9*Math.sin(t*1.3)+4*Math.sin(t*4):-64,sp=new Uint8Array(64);
  for(let j=0;j<64;j++)sp[j]=Math.max(0,(.45+.4*Math.sin(j*.4+t*2))*(1-j/90)*(voz?1:.12)*255);
  return mk({f0:voz?f0:0,db,jit:.4+.3*Math.sin(t),shim:.3+.2*Math.sin(t*1.7),hnr:16+5*Math.sin(t*.8),cpp:8+2*Math.sin(t),cent:1100+400*Math.sin(t*.7),tilt:-8,voz,flow:.3+.15*Math.sin(t*1.1),cq:.5+.15*Math.sin(t*.6),floor:-68,sp})}
function analisar(){
  const b=R.buf,sr=R.sr;R.an.getFloatTimeDomainData(b);R.an.getFloatFrequencyData(R.fb);
  let e=0;for(let i=0;i<b.length;i++)e+=b[i]*b[i];const rms=Math.sqrt(e/b.length),db=20*Math.log10(rms+1e-6);
  const d=Math.max(1,Math.round(sr/12000)),n=512,x=new Float32Array(n),off=b.length-n*d;
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<d;j++)s+=b[off+i*d+j]||0;x[i]=s/d}
  const fs=sr/d,lmin=Math.floor(fs/400),lmax=Math.floor(fs/70);let r0=1e-9;for(let i=0;i<n;i++)r0+=x[i]*x[i];
  let best=0,bl=lmin;const rr=[];
  for(let l=lmin;l<=lmax;l++){let s=0;for(let i=0;i<n-l;i++)s+=x[i]*x[i+l];s/=r0;rr[l]=s;if(s>best){best=s;bl=l}}
  for(let l=lmin+1;l<bl;l++)if(rr[l]>=.9*best&&rr[l]>rr[l-1]&&rr[l]>=rr[l+1]){bl=l;best=rr[l];break}
  R.fl.push(db);if(R.fl.length>80)R.fl.shift();const floor=Math.min(...R.fl);
  const voz=db>floor+9&&best>.5;let f0=0,jit=D.jit,shim=D.shim;
  if(voz){const T=bl/fs;f0=1/T;R.P.push(T);R.A.push(rms);if(R.P.length>10){R.P.shift();R.A.shift()}
    if(R.P.length>3){let s=0,q=0;for(let i=1;i<R.P.length;i++){s+=Math.abs(R.P[i]-R.P[i-1]);q+=Math.abs(20*Math.log10(R.A[i]/R.A[i-1]))}jit=s/(R.P.length-1)/med(R.P)*100;shim=q/(R.A.length-1)}}
  else{R.P=[];R.A=[]}
  const bc=Math.min(.98,Math.max(.02,best)),hnr=10*Math.log10(bc/(1-bc)),fb=R.fb,nb=fb.length,bh=sr/2/nb,sp=new Uint8Array(64),pw=[];
  let lo=0,hi=0,cs=0,ct=0;
  for(let j=0;j<64;j++){const f1=60*Math.pow(8000/60,j/64),f2=60*Math.pow(8000/60,(j+1)/64);let m=-140;
    for(let k=Math.floor(f1/bh);k<=Math.max(Math.floor(f2/bh),Math.floor(f1/bh));k++)if(fb[k]>m)m=fb[k];
    sp[j]=Math.max(0,Math.min(255,(m+100)*3.2));const p=Math.pow(10,m/10),fc=Math.sqrt(f1*f2);cs+=fc*p;ct+=p;if(fc<1000)lo+=p;else if(fc<5000)hi+=p}
  const cent=ct?cs/ct:0,tilt=10*Math.log10((hi+1e-12)/(lo+1e-12));
  const k0=Math.ceil(60/bh),k1=Math.floor(4000/bh);let mL=0;for(let k=k0;k<k1;k++)mL+=Math.max(-140,fb[k]);mL/=(k1-k0);
  let cmax=0,csum=0,cn=0;for(let q=.001;q<.02;q+=.0004){let s=0;for(let k=k0;k<k1;k++)s+=(Math.max(-140,fb[k])-mL)*Math.cos(6.2832*k*bh*q);s=Math.abs(s)/(k1-k0);csum+=s;cn++;if(q>.0025&&q<.014&&s>cmax)cmax=s}
  const cpp=Math.max(0,cmax-csum/cn);
  let cq=.5,flow=.3;
  if(voz){const a=Math.max(...[-1,0,1].map(o=>fb[Math.round(f0/bh)+o]||-140)),c=Math.max(...[-1,0,1].map(o=>fb[Math.round(2*f0/bh)+o]||-140));cq=Math.max(.1,Math.min(.9,.6-(a-c)/40));flow=Math.min(1,.15+.5*(1-bc)+.35*rg(db,-60,-10))}
  return mk({f0,db,jit,shim,hnr,cpp,cent,tilt,voz,flow,cq,floor,sp})
}
function tick(){

}

const G=[];const serie=()=>rec?rec.tk:(U.sel!=null&&U.sessoes[U.sel]?U.sessoes[U.sel].tk:H);

  L.forEach((k,i)=>{if(k.voz)for(let q=0;q<3;q++)dot(x,i/159*W+Math.sin(i*7+q*2+t*9)*k.jit*2,Y(k)+Math.cos(i*5+q+t*8)*(2+k.jit*5),1,'rgba(165,243,252,.55)')});
  const py=h-8-rg(D.f0,70,400)*(h-16);for(let r=0;r<3;r++){x.strokeStyle=`rgba(125,211,252,${.6-r*.18})`;x.lineWidth=1;x.beginPath();x.arc(W-4,py,4+((t*30+r*8)%24),0,6.28);x.stroke()}};
G[1]=(x,W,h,t)=>{fade(x,W,h,.3);const cx=W/2,cy=h/2,q=rg(D.db,-60,-10),R0=h*.25+q*h*.14,th=3+q*9,sh=D.shim*4;
  for(let p=0;p<3;p++){x.strokeStyle=`rgba(251,146,60,${.9-p*.28})`;x.lineWidth=Math.max(1,th-p*2.4);x.beginPath();
    for(let i=0;i<=120;i++){const a=i/120*6.2832,r=R0+Math.sin(a*6+t*3+p)*(1+sh)*(1+p*.4)+Math.sin(a*11-t*4)*sh;const px=cx+Math.cos(a)*r*1.5,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke()}
  dot(x,cx,cy,5+q*9,'rgba(254,215,170,.9)')};
G[2]=(x,W,h,t)=>{fade(x,W,h,.35);const n=48,bw=W/n,q=rg(D.hnr,0,25);
  for(let i=0;i<n;i++){const v=D.sp[Math.floor(i*64/n)]/255,bh=v*(h-10)*(.88+.12*Math.sin(t*5+i));x.fillStyle=`hsla(${20+q*110},85%,${45+v*20}%,.9)`;x.fillRect(i*bw+1,h-bh,bw-2,bh);x.fillStyle='rgba(255,255,255,.5)';x.fillRect(i*bw+1,h-bh-2,bw-2,2)}};

      out=(await (await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+U.key},body:JSON.stringify({model:CFG.OPENAI,messages:[{role:'system',content:sys},...m]})})).json()).choices[0].message.content
    }else{
      const m=U.hist.map((h,i)=>({role:h.r==='user'?'user':'model',parts:(i===last&&im)?[{text:h.t},{inline_data:{mime_type:'image/jpeg',data:im}}]:[{text:h.t}]}));
      out=(await (await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CFG.GEMINI}:generateContent?key=${U.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:m})})).json()).candidates[0].content.parts[0].text}}}catch(e){out=''}
  out=(out||'').trim();if(out)U.hist.push({r:'ia',t:out});else U.hist.pop();return out
}
async function iaFalar(txt,res,img,fim){
  const n=U.ciclo,prev=U.sessoes.slice(1).map(s=>({f0:s.res.f0&&s.res.f0.m,db:s.res.db&&s.res.db.m,jit:s.res.jit&&s.res.jit.m,shim:s.res.shim&&s.res.shim.m,hnr:s.res.hnr&&s.res.hnr.m,cpp:s.res.cpp&&s.res.cpp.m,pausas:s.res.pausas}));
  const p=`[SISTEMA] Sessão ${n}/${CFG.MAX} do ciclo concluída. Fala transcrita: "${txt||'(nada detectado)'}". Dados CRS internos: ${JSON.stringify({atual:res,anteriores:prev})}. `+(fim?'Esta foi a última sessão: comente os achados em linguagem simples, sem diagnóstico, agradeça e despeça-se.':`Comente brevemente e passe a próxima instrução: "${CFG.ETAPAS[n]}"`);
  const w=chatAdd('ia','…'),r=await ia(p,img);w.remove();
  if(!r&&U.key)aviso('A IA não respondeu. Confira provedor e chave no perfil.');
  const t=r||(fim?`Calibração concluída, ${U.nome}. Obrigado! Até logo.`:`Sessão ${n} registrada. Próxima: ${CFG.ETAPAS[n]}`);chatAdd('ia',t);falar(t)
}
async function iaIntro(){
  const k=U.ciclo,w=chatAdd('ia','…'),r=await ia(`[SISTEMA] Operador: ${U.nome}. ${k?`Retomando o ciclo, ${k} de ${CFG.MAX} sessões feitas.`:`Dê boas-vindas e explique em uma frase que são ${CFG.MAX} sessões curtas de voz e que a primeira é só um teste de conexão.`} Passe a instrução da sessão ${k+1}: "${CFG.ETAPAS[k]}"`);
  w.remove();if(!r&&!U.key)aviso('IA do perfil não configurada: conversa em modo roteiro. <a href="perfil.html">Configurar</a>');
  const t=r||`Bem-vindo, ${U.nome}. Faremos ${CFG.MAX} sessões curtas de voz. Sessão ${k+1}: ${CFG.ETAPAS[k]}`;chatAdd('ia',t);falar(t)
}

addEventListener('DOMContentLoaded',()=>{fit();requestAnimationFrame(loop);carregar()});
