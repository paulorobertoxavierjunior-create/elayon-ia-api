<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elayon Space — Espaço de Escuta Simbólica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #6366f1; --primary-hover: #4f46e5; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--card); padding: 40px 30px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); border: 1px solid var(--border); text-align: center; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { font-size: 13px; color: var(--primary); font-weight: 500; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; transition: all 0.2s; display: inline-block; }
        .btn-primary { background: var(--primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Elayon Space</h1>
        <div class="subtitle">Espaço de Escuta Simbólica</div>
        <p>Humanidade e Tecnologia, em Harmonia. Um ecossistema dedicado à integração cognitiva, preservando sua essência e autonomia.</p>
        
        <div class="btn-group">
            <a href="login.html" class="btn btn-primary">Acessar Plataforma</a>
            <a href="cadastro.html" class="btn btn-outline">Criar Nova Conta</a>
        </div>
    </div>
</body>
</html>
