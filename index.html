<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elayon - Sistema de Acesso</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo-area p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px 12px 40px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 8px;
        }

        .btn:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }

        .auth-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .auth-links a, .auth-links button {
            color: var(--text-muted);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
        }

        .auth-links a:hover, .auth-links button:hover { color: var(--primary); }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: #86efac;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="globalAlert" class="alert"></div>

        <!-- 1. TELA DE LOGIN -->
        <div id="loginView" class="view-section active">
            <div class="logo-area">
                <h1>Elayon</h1>
                <p>Acesse sua conta para continuar</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <div class="input-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="loginEmail" class="form-control" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-icon">
                        <i class="fa-lock fa-solid"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn">Entrar</button>
                <div class="auth-links">
                    <button type="button" onclick="switchView('forgotView')">Esqueceu a senha?</button>
                    <button type="button" onclick="switchView('registerView')">Criar conta</button>
                </div>
            </form>
        </div>

        <!-- 2. TELA DE CADASTRO -->
        <div id="registerView" class="view-section">
            <div class="logo-area">
                <h1>Criar Conta</h1>
                <p>Junte-se ao ecossistema Elayon</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label>E-mail</label>
                    <div class="input-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="regEmail" class="form-control" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-icon">
                        <i class="fa-lock fa-solid"></i>
                        <input type="password" id="regPassword" class="form-control" placeholder="Mínimo 6 caracteres" required>
                    </div>
                </div>
                <button type="submit" class="btn">Cadastrar</button>
                <div class="auth-links" style="justify-content: center; margin-top: 16px;">
                    <button type="button" onclick="switchView('loginView')">Já tem uma conta? Faça login</button>
                </div>
            </form>
        </div>

        <!-- 3. TELA DE RECUPERAÇÃO DE SENHA -->
        <div id="forgotView" class="view-section">
            <div class="logo-area">
                <h1>Recuperar Senha</h1>
                <p>Enviaremos as instruções para seu e-mail</p>
            </div>
            <form id="forgotForm">
                <div class="form-group">
                    <label>E-mail cadastrado</label>
                    <div class="input-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="forgotEmail" class="form-control" placeholder="seu@email.com" required>
                    </div>
                </div>
                <button type="submit" class="btn">Enviar Instruções</button>
                <div class="auth-links" style="justify-content: center; margin-top: 16px;">
                    <button type="button" onclick="switchView('loginView')">Voltar para o Login</button>
                </div>
            </form>
        </div>

        <!-- 4. TELA DE REDEFINIÇÃO DE SENHA -->
        <div id="resetView" class="view-section">
            <div class="logo-area">
                <h1>Nova Senha</h1>
                <p>Defina sua nova credencial de acesso</p>
            </div>
            <form id="resetForm">
                <div class="form-group">
                    <label>Nova Senha</label>
                    <div class="input-icon">
                        <i class="fa-lock fa-solid"></i>
                        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn">Atualizar Senha</button>
            </form>
        </div>

        <!-- 5. PAINEL DO USUÁRIO LOGADO -->
        <div id="dashboardView" class="view-section">
            <div class="logo-area">
                <h1>Bem-vindo!</h1>
                <p id="userSessionEmail" style="color: var(--primary); font-weight: 500; margin-top: 4px;"></p>
            </div>
            <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.5;">
                <p>Você está conectado ao ambiente seguro do Elayon.</p>
                <p style="margin-top: 8px; color: var(--text-muted);">Suporte técnico: <a href="mailto:contato.elayon@gmail.com" style="color: var(--primary);">contato.elayon@gmail.com</a></p>
            </div>
            <button onclick="handleLogout()" class="btn" style="background: var(--border);">Sair da Conta</button>
            <button onclick="handleDeleteAccount()" class="btn btn-danger" style="margin-top: 12px;">Excluir Conta Permanentemente</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xlktkelumptugiidnecbj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsa3RrZWx1bXRwdWdpZG5lY2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzU4OTgsImV4cCI6MjEwNjM1MTg5OH0.EIn9oiFl7PmhYhaMlvYKljeFVZflRCbxD_HT65-88XM';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            hideAlert();
        }

        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById('globalAlert');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type}`;
            alertEl.style.display = 'block';
        }

        function hideAlert() {
            const alertEl = document.getElementById('globalAlert');
            alertEl.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            if (hash && hash.includes('type=recovery')) {
                switchView('resetView');
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                appLoaded(session.user);
            }

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    appLoaded(session.user);
                } else if (event === 'SIGNED_OUT') {
                    switchView('loginView');
                }
            });
        });

        async function appLoaded(user) {
            document.getElementById('userSessionEmail').textContent = user.email;
            switchView('dashboardView');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { emailRedirectTo: window.location.origin }
            });

            if (error) {
                showAlert(error.message, 'error');
            } else {
                showAlert('Cadastro realizado com sucesso! Verifique seu e-mail ou faça login.', 'success');
                document.getElementById('registerForm').reset();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showAlert(error.message, 'error');
            } else {
                appLoaded(data.user);
            }
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('forgotEmail').value;
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin
            });

            if (error) {
                showAlert(error.message, 'error');
            } else {
                showAlert('Instruções de recuperação enviadas para o seu e-mail.', 'success');
                document.getElementById('forgotForm').reset();
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const newPassword = document.getElementById('newPassword').value;
            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                showAlert(error.message, 'error');
            } else {
                showAlert('Senha atualizada com sucesso! Faça login.', 'success');
                setTimeout(() => {
                    supabaseClient.auth.signOut();
                    switchView('loginView');
                }, 2000);
            }
        });

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            switchView('loginView');
        }

        async function handleDeleteAccount() {
            if (!confirm('Tem certeza absoluta que deseja excluir sua conta permanentemente?')) return;
            await supabaseClient.auth.signOut();
            showAlert('Conta desativada. Para exclusão total, contate contato.elayon@gmail.com', 'success');
            setTimeout(() => switchView('loginView'), 3000);
        }
    </script>
</body>
</html>
