<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Space • Entrada</title>
  <style>
    :root{
      --bg1:#eaf7e3;
      --bg2:#dff4f6;
      --card:#ffffff;
      --ink:#0a2a2f;
      --muted:#4a6b70;
      --line:#cfe4e7;
      --accent:#66c7c0;
      --accent2:#7bd490;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(circle at top left, var(--bg1), var(--bg2));
      color:var(--ink);
    }

    .card{
      width:100%;
      max-width:460px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:40px 30px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .logo{
      width:84px;
      height:84px;
      object-fit:contain;
      margin-bottom:20px;
      border-radius:18px;
      background:#fff;
    }

    h1{
      font-size:30px;
      letter-spacing:-1px;
      margin-bottom:10px;
    }

    p{
      color:var(--muted);
      font-size:15px;
      line-height:1.6;
      margin-bottom:28px;
    }

    .actions{
      display:grid;
      gap:12px;
    }

    .btn{
      display:block;
      width:100%;
      padding:16px;
      border-radius:14px;
      text-decoration:none;
      font-size:16px;
      font-weight:800;
      transition:.2s ease;
    }

    .btn:hover{ transform:translateY(-2px); }

    .primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:var(--ink);
    }

    .secondary{
      background:#f0f7f7;
      border:1px solid var(--line);
      color:var(--ink);
    }

    .note{
      margin-top:24px;
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="logo"
      src="./elayon_logo.png"
      alt="Elayon Space"
      onerror="this.onerror=null;this.src='https://elayon.space/wp-content/uploads/2026/04/elayon_logo.png';"
    />

    <h1>Bem-vindo ao Elayon</h1>
    <p>
      Acesse sua conta ou crie um novo cadastro para entrar no ambiente Elayon.
    </p>

    <div class="actions">
      <a class="btn primary" href="login.html">Entrar</a>
      <a class="btn secondary" href="cadastro.html">Criar cadastro</a>
    </div>

    <div class="note">
      Entrada simples. Autenticação segura. Sessão individual.
    </div>
  </main>
</body>
</html>
