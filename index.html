<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Space • Entrada</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg1:#eaf7e3;
      --bg2:#dff4f6;
      --card:#ffffff;
      --ink:#0a2a2f;
      --muted:#4a6b70;
      --line:#cfe4e7;
      --accent:#66c7c0;
      --accent2:#7bd490;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(circle at top left, var(--bg1), var(--bg2));
      color:var(--ink);
    }

    .card{
      width:100%;
      max-width:460px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:40px 30px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .logo{
      width:84px;
      height:84px;
      object-fit:contain;
      margin-bottom:20px;
      border-radius:18px;
      background:#fff;
    }

    h1{
      font-size:30px;
      letter-spacing:-1px;
      margin-bottom:10px;
    }

    p{
      color:var(--muted);
      font-size:15px;
      line-height:1.6;
      margin-bottom:28px;
    }

    .actions{
      display:grid;
      gap:12px;
    }

    .btn{
      display:block;
      width:100%;
      padding:16px;
      border-radius:14px;
      text-decoration:none;
      font-size:16px;
      font-weight:800;
      transition:.2s ease;
    }

    .btn:hover{ transform:translateY(-2px); }

    .primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:var(--ink);
    }

    .secondary{
      background:#f0f7f7;
      border:1px solid var(--line);
      color:var(--ink);
    }

    .note{
      margin-top:24px;
      font-size:12px;
      color:var(--muted);
    }

    .pagina{
      width:100%;
      max-width:460px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .rodape{
      width:100%;
      margin-top:150px;
      padding-bottom:40px;
      text-align:center;
    }

    .log{
      margin-top:0;
      background:none;
      border:0;
      font:inherit;
      font-size:11px;
      color:#cce2d9;
      padding:10px 18px;
      cursor:default;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }

    .logbox{
      display:none;
      gap:8px;
      margin-top:6px;
      justify-content:center;
    }

    .logbox input{
      flex:1;
      min-width:0;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      font:inherit;
      font-size:14px;
      outline:none;
    }

    .logbox button{
      padding:10px 14px;
      border:0;
      border-radius:10px;
      font:inherit;
      font-size:13px;
      font-weight:800;
      color:var(--ink);
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      cursor:pointer;
    }

    .logmsg{
      font-size:12px;
      color:var(--muted);
      margin-top:8px;
      min-height:16px;
    }

    .logmsg a{ color:var(--ink); font-weight:800; }
  </style>
</head>
<body>
  <div class="pagina">
  <main class="card">
    <img
      class="logo"
      src="./elayon_logo.png"
      alt="Elayon Space"
      onerror="this.onerror=null;this.src='https://elayon.space/wp-content/uploads/2026/04/elayon_logo.png';"
    />

    <h1>Bem-vindo ao Elayon</h1>
    <p>
      Eu sou:
    </p>

    <div class="actions">
      <a class="btn primary" href="app-usuario.html?novo=1">Usuário</a>
      <a class="btn secondary" href="app-medico.html?novo=1">Médico</a>
      <a class="btn secondary" href="app-master.html?novo=1">Master</a>
    </div>

    <div class="note">
      Cadastre-se ou entre no espaço escolhido. Autenticação segura. Sessão individual. <a href="termos.html">Termos</a> · <a href="privacidade.html">Privacidade</a>
    </div>

  </main>

  <div class="rodape">
      <button type="button" class="log" id="log" aria-label="log">log</button>
      <form class="logbox" id="logbox" autocomplete="off">
        <input type="password" id="logpw" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="campo" />
      <button type="submit">OK</button>
    </form>
    <div class="logmsg" id="logmsg"></div>
  </div>
  </div>

  <script>
    /* Canal reservado: 10 toques em "log" (em até 20 s) abrem um campo.
       O que for digitado vai direto ao servidor, que confere. Nada fica guardado nesta página. */
    (function () {
      var sb = null;
      try {
        sb = window.supabase ? supabase.createClient('https://xlktkelumtpugidnecbj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsa3RrZWx1bXRwdWdpZG5lY2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzU4OTgsImV4cCI6MjEwNjM1MTg5OH0.EIn9oiFl7PmhYhaMlvYKljeFVZflRCbxD_HT65-88XM') : null;
      } catch (e) { sb = null; }

      var toques = [];
      var box = document.getElementById('logbox');
      var pw = document.getElementById('logpw');
      var msg = document.getElementById('logmsg');

      document.getElementById('log').addEventListener('click', function () {
        var agora = Date.now();
        toques = toques.filter(function (t) { return agora - t < 20000; });
        toques.push(agora);
        if (toques.length >= 10) {
          toques = [];
          box.style.display = 'flex';
          pw.focus();
        }
      });

      var cod = null;
      function aparelho() {
        var d = '';
        try { d = localStorage.getItem('elx_ap') || ''; } catch (err) {}
        if (d.length < 32) {
          var a = new Uint8Array(32);
          crypto.getRandomValues(a);
          d = Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
          try { localStorage.setItem('elx_ap', d); } catch (err) {}
        }
        return d;
      }
      var hp = /^#p=([A-Za-z0-9]{6,12})$/.exec(location.hash || '');
      if (hp) {
        cod = document.createElement('input');
        cod.type = 'hidden'; cod.value = hp[1];
        box.appendChild(cod);
        try { history.replaceState(null, '', location.pathname); } catch (err) {}
      }
      box.addEventListener('submit', async function (e) {
        e.preventDefault();
        var v = pw.value;
        msg.innerHTML = '';
        if (!v || !sb) return;
        var c = cod ? cod.value : null;
        var r = null;
        try { r = (await sb.rpc('adv_entrar', { p_senha: v, p_disp: aparelho(), p_codigo: c })).data; } catch (err) { r = null; }
        if (!(r && r.erro === 'aparelho_novo') && !cod) pw.value = '';
        if (r && r.ok) {
          try { sessionStorage.setItem('adv_tok', r.token); } catch (err) {}
          location.href = 'advanced.html';
          return;
        }
        if (r && r.erro === 'bloqueado') { msg.textContent = 'Tente mais tarde.'; return; }
        if (r && r.erro === 'aparelho_novo' && !cod) {
          cod = document.createElement('input');
          cod.type = 'text'; cod.autocomplete = 'off'; cod.setAttribute('style', pw.getAttribute('style') || '');
          cod.className = pw.className;
          box.insertBefore(cod, box.firstChild);
          msg.textContent = '';
          cod.focus();
        }
      });
    })();
  </script>
</body>
</html>
