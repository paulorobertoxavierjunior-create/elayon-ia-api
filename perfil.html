<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Space • Perfil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg1:#eaf7e3;
      --bg2:#dff4f6;
      --card:#ffffff;
      --ink:#0a2a2f;
      --muted:#4a6b70;
      --line:#cfe4e7;
      --accent:#66c7c0;
      --accent2:#7bd490;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(circle at top left, var(--bg1), var(--bg2));
      color:var(--ink);
    }

    .card{
      width:100%;
      max-width:480px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:40px 30px;
      box-shadow:var(--shadow);
    }

    h1{
      font-size:28px;
      margin-bottom:10px;
      letter-spacing:-1px;
    }

    .sub{
      color:var(--muted);
      font-size:14px;
      margin-bottom:22px;
      line-height:1.5;
    }

    .box{
      background:#f8fbfb;
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin-bottom:18px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-size:14px;
      margin-bottom:10px;
    }

    .row:last-child{ margin-bottom:0; }

    .label{ color:var(--muted); }
    .value{ font-weight:700; word-break:break-word; text-align:right; }

    .tokens{
      color:#0f766e;
      font-weight:800;
    }

    .actions{
      display:grid;
      gap:12px;
      margin-top:18px;
    }

    .btn{
      display:block;
      width:100%;
      padding:16px;
      border-radius:14px;
      text-decoration:none;
      text-align:center;
      font-size:16px;
      font-weight:800;
      border:0;
      cursor:pointer;
      transition:.2s ease;
    }

    .btn:hover{ transform:translateY(-2px); }

    .primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:var(--ink);
    }

    .secondary{
      background:#f0f7f7;
      border:1px solid var(--line);
      color:var(--ink);
    }

    .logout{
      background:transparent;
      border:1px solid var(--line);
      color:var(--muted);
    }

    .msg{
      margin-top:14px;
      font-size:13px;
      color:#d9534f;
      min-height:18px;
      text-align:center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Seu perfil</h1>
    <p class="sub">
      Aqui estão seus dados de acesso e o saldo de tokens da sua conta.
    </p>

    <section class="box">
      <div class="row">
        <span class="label">ID</span>
        <span class="value" id="userId">Carregando...</span>
      </div>
      <div class="row">
        <span class="label">Nome</span>
        <span class="value" id="userName">Carregando...</span>
      </div>
      <div class="row">
        <span class="label">E-mail</span>
        <span class="value" id="userEmail">Carregando...</span>
      </div>
      <div class="row">
        <span class="label">Tokens</span>
        <span class="value tokens" id="userTokens">100</span>
      </div>
    </section>

    <div class="actions">
      <!-- Botão apontando para o repositório/projeto Elayon Avaliação -->
      <a class="btn primary" href="https://github.com/paulorobertoxavierjunior-create/elayon-avaliacao/index.html" target="_blank" rel="noopener noreferrer">
        Iniciar Elayon Avaliação
      </a>

      <a class="btn secondary" href="login.html">
        Voltar ao login
      </a>

      <button class="btn logout" id="btnLogout" type="button">
        Sair
      </button>
    </div>

    <div class="msg" id="msg"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://xlktkelumtpugidnecbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsa3RrZWx1bXRwdWdpZG5lY2JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzU4OTgsImV4cCI6MjEwNjM1MTg5OH0.EIn9oiFl7PmhYhaMlvYKljeFVZflRCbxD_HT65-88XM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initAuth() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      if (error || !session) {
        window.location.href = 'login.html';
        return;
      }

      const user = session.user;
      document.getElementById('userId').textContent = user.id;
      document.getElementById('userEmail').textContent = user.email || '-';
      document.getElementById('userName').textContent = user.user_metadata?.nome || user.email.split('@')[0];
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    initAuth();
  </script>
</body>
</html>
