<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon</title><link rel="manifest" href="/app-usuario.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-usuario.png"><link rel="icon" href="/icons/icon-usuario-192.png"><meta name="theme-color" content="#2a9d8f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
const PASSOS=[['Seu médico convidou você','Você entrou com o convite do seu médico. Só ele e a clínica dele acompanham o que você envia.'],['Sua IA é sua','Na aba Perfil você coloca a chave da sua própria IA. Ela trabalha só para você e a plataforma não cobra por isso.'],['Preencha a ficha uma vez','A ficha básica no Perfil poupa o médico de perguntar tudo de novo. Atualize quando algo mudar.'],['Calibre a ferramenta','Em Minha ferramenta (aba Perfil) grave a sua fala e faça a calibração. Ao terminar, toque em “Concluí a calibração”.'],['Peça a liberação ao seu médico','Com o treino e a calibração prontos, peça a liberação no Início. O médico confere e libera o seu acesso com a credencial da clínica.'],['Tarefas do seu médico','Depois da liberação, as tarefas aparecem na aba Tarefas, com datas. Faça uma de cada vez.'],['Enviar à clínica','Ao terminar, o resultado vai para a clínica, que confere o cadastro e libera ao seu médico. Você também pode gravar exercícios à vontade e enviar.'],['O que este app não é','Não faz diagnóstico nem substitui consulta. Quem responde pelo seu cuidado é o seu médico.']];
const ST={sem_caso:['Pronto para começar','Use a sua ferramenta quando quiser. Se quiser falar com a clínica, escreva na aba Clínica.'],na_clinica:['A clínica recebeu','A clínica está avaliando o que você enviou e vai encaminhar ao seu médico.'],encaminhado:['Com o seu médico','O seu médico está analisando. Assim que ele responder, a clínica valida e libera as próximas tarefas.'],reavaliar:['A clínica está validando','O seu médico respondeu. A clínica confere e libera as suas tarefas em breve.'],em_tarefas:['Você tem tarefas','A clínica liberou as tarefas do seu médico. Abra a aba Tarefas.'],concluido:['Etapa concluída','A clínica deu OK nos seus exercícios. Fim desta etapa.'],alta:['Alta','O seu médico concluiu esta etapa.']};
Elx.inicia({tipo:'usuario',nome:'Elayon',cor:'#2a9d8f',titulo:'Bem-vindo ao Elayon',frase:'Seu espaço de escuta e aprendizagem. O acesso é por convite do seu médico.'},async(u)=>{
 const A=$('app');A.innerHTML='<div class="c"><h2>Olá!</h2><p>Carregando seu espaço…</p></div>';
 let pend=[],cs={status:'sem_caso'},P={};try{pend=await rpc('treinos_pendentes')}catch(e){}try{cs=await rpc('caso_atual')}catch(e){}let av=[];try{av=await rpc('meus_avisos')||[]}catch(e){}let sc={retidos:0,pedido:false,tem_medico:false};try{sc=await rpc('usuario_status_clinica')||sc}catch(e){}try{const r=await sb.from('profiles').select('nome,ai_key,ai_cfg,anamnese,treino_usuario_em,avatar_url').eq('id',u.id).maybeSingle();P=r.data||{}}catch(e){}
 const st=cs.status||'sem_caso',n=(pend||[]).length,ia=!!(P.ai_key||Object.keys(P.ai_cfg||{}).some(k=>k[0]!=='_'&&(P.ai_cfg[k]||{}).key)),ficha=!!(P.anamnese&&P.anamnese.motivo);
 const stt=(st==='sem_caso'&&n)?ST.em_tarefas:(ST[st]||ST.sem_caso);
 const wa=cs.clinica_whatsapp?'https://wa.me/'+(String(cs.clinica_whatsapp).length<=11?'55':'')+cs.clinica_whatsapp+'?text='+encodeURIComponent('Olá, sou usuário do Elayon e queria falar com a clínica.'):'';
 const pr=(!ia||!ficha);
 const ac=sc.acesso||'sem_medico',lib=(ac==='liberado'||ac==='sem_medico');
 const ck=(ok,t)=>'<small>'+(ok?'✓ ':'○ ')+t+'</small>';
 const acessoCard=ac==='treinando'?'<div class="c"><h3>Seu acesso à clínica</h3><p>Antes das tarefas, faça estes passos e peça a liberação ao seu médico.</p>'+ck(ia,'Colocar a minha IA (Perfil)')+ck(!!sc.treino,'Treinamento (aba Aprender)')+ck(!!sc.calibrado,'Calibração (Perfil, Minha ferramenta)')+'<button class="b" id="pdLb" style="margin-top:8px"'+((sc.treino&&sc.calibrado&&ia)?'':' disabled')+'>Pedir liberação ao meu médico</button><div class="msg" id="pdLm"></div></div>':ac==='aguardando'?'<div class="c"><h3>Liberação pedida</h3><p>Seu médico vai conferir e liberar o seu acesso. Depois disso as tarefas aparecem aqui.</p><button class="b g" onclick="location.reload()">Atualizar</button></div>':(ac==='liberado'&&sc.credencial?'<div class="c"><h3>Acesso liberado</h3><p>Credencial da clínica: <b>'+esc(sc.credencial)+'</b></p></div>':'');
 const aviso=(av||[]).map(a=>'<div class="alerta"><b>'+(a.tipo==='vencido'?'Prazo vencido':'Prazo se aproximando')+'</b><p>'+esc(a.titulo||'Seus exercícios')+(a.prazo?' · até '+new Date(a.prazo).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'. Abra a aba Tarefas.</p></div>').join('');
 const atu=sc.tem_medico?'<div class="c"><h3>Atualização do meu médico</h3><p>'+(sc.pedido?'Pedido enviado. A clínica vai revisar e liberar o que o seu médico preparou.':sc.retidos>0?'Há '+sc.retidos+' item(ns) do seu médico aguardando a clínica liberar. Peça a atualização para avisá-la.':'Quando quiser novidades do seu médico, peça uma atualização. A clínica revisa e libera o laudo e os exercícios para você.')+'</p>'+(sc.pedido?'':'<button class="b" id="pdAt">Pedir atualização</button>')+'<div class="msg" id="pdM"></div></div>':'';
 const cdCard=!sc.tem_medico?'<div class="c"><h3>Código do seu médico</h3><p>Digite o código que o seu médico te passou para ligar a sua conta a ele.</p><input id="cdM" autocapitalize="characters" placeholder="MED-XXXX-XXXX"><button class="b" id="cdB">Ligar ao meu médico</button><div class="msg" id="cdMs"></div></div>':'';
 let blq=false;try{blq=(await rpc('usuario_bloqueado')).bloqueado}catch(e){}
 const blqCard=blq?'<div class="alerta"><b>Ferramenta bloqueada.</b> Há exercícios com prazo vencido. Faça-os para liberar o uso.</div>':'';
 const mi=(ic,t,tab,soon)=>'<button class="mi" '+(soon?'disabled':'data-go="'+tab+'"')+'><span>'+ic+'</span><b>'+t+'</b>'+(soon?'<i>em breve</i>':'')+'</button>';
 const menu='<div class="mg">'+mi('🩺','Solicitar atendimento','cl')+mi('📋','Minhas tarefas','ta')+mi('🎙️','Minha ferramenta','pf')+mi('📈','Histórico de consultas','cl')+mi('📄','Resultados e laudos','cl')+mi('❤️','Sinais vitais','',1)+mi('👤','Minha conta','pf')+mi('🛡️','Privacidade','',1)+mi('📚','Aprender','ap')+mi('❓','Ajuda','pf')+'</div><style>.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mi{background:#1f4690;color:#fff;border:0;border-radius:18px;padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;font:inherit}.mi span{font-size:24px}.mi b{font-size:15px}.mi i{font-size:11px;background:#2aa851;border-radius:8px;padding:2px 6px;align-self:flex-start;font-style:normal}.mi[disabled]{opacity:.65}</style>';
 const inicio=menu+cdCard+blqCard+acessoCard+(lib?aviso+atu:'')+'<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>'+esc(P.nome?'Olá, '+P.nome.split(' ')[0]:'Meu espaço')+'</h1><p>'+(cs.clinica?'Acompanhamento de '+esc(cs.clinica)+(cs.medico?' · '+esc(cs.medico):'')+'.':'Seu acompanhamento começa com o convite do seu médico.')+'</p></div>'
  +(pr?'<div class="alerta"><b>Falta completar o perfil.</b> '+(!ia?'Coloque a sua IA. ':'')+(!ficha?'Preencha a ficha básica. ':'')+'<br>É uma vez só, no começo.<button class="b" id="vaiP" style="margin-top:8px">Completar agora</button></div>':'')
  +(!lib?'':'<div class="c"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>'+esc(stt[0])+'</h3><span class="pill'+(st==='concluido'||st==='alta'?' ok':'')+'">'+(cs.ciclo?'etapa '+cs.ciclo:'início')+'</span></div><p>'+esc(stt[1])+(st==='reavaliar'&&cs.nota?' Recado do médico: '+esc(cs.nota):'')+(st==='alta'&&cs.nota?' Recado: '+esc(cs.nota):'')+'</p></div>')
  +'<div class="c"><h3>Minha ferramenta</h3><p>Observe a sua fala, os seus ritmos e os seus silêncios, com a sua própria IA.</p>'+(ia?'<button class="b" id="abreF">Abrir minha ferramenta</button>':'<button class="b g" id="vaiP2">Configure a sua IA para usar</button>')+'</div>'
  +(n&&lib?'<div class="c"><h3>'+n+' tarefa'+(n>1?'s':'')+' na fila</h3><p>Feitas pelo seu médico e validadas pela clínica.</p><a class="b" href="/meu-espaco.html">Carregar a atualização e fazer</a></div>':'')
  +'<p class="cen hint">Ferramenta de acompanhamento e aprendizagem. Não faz diagnóstico: quem responde pelo cuidado é o seu médico.</p>';
 const tarefas='<div class="c"><h3>Tarefas em fila ('+n+')</h3>'+(n?pend.map((t,i)=>'<div class="it"><div class="r"><b>'+(i+1)+'. '+esc(t.titulo)+'</b><span class="pill">'+((t.exercicios||[]).length)+' exercício(s)</span></div>'+(t.orientacao?'<small>'+esc(String(t.orientacao).slice(0,160))+'</small>':'')+(t.prazo?'<small>Prazo: '+new Date(t.prazo).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(new Date(t.prazo)<new Date()?' · vencido':'')+'</small>':'')+'</div>').join('')+'<a class="b" href="/meu-espaco.html">Abrir e fazer</a><p>Ao terminar, o resultado vai sozinho para a clínica.</p>':'<p>Nada na fila. Quando o seu médico preparar algo e a clínica liberar, aparece aqui. Se houver mais de uma, elas se acumulam em ordem.</p>')+'</div>';
 const clinica='<div class="c"><h3>Enviar à clínica</h3>'+(cs.tem_medico?'<p>Quer contar algo ao seu médico? Escreva a observação. A clínica confere e encaminha.</p><textarea id="obs" maxlength="1000" placeholder="Ex.: dormi mal esta semana e a respiração ficou curta."></textarea><button class="b" id="obsB">Enviar à clínica</button><div class="msg" id="obsM"></div>':'<p>Você ainda não está vinculado a uma clínica ativa. Peça ao seu médico um novo convite.</p>')+(cs.obs?'<div class="it"><small>Última observação enviada</small><p style="white-space:pre-wrap">'+esc(cs.obs)+'</p></div>':'')+'</div>'
  +(wa?'<div class="c"><h3>Falar com a clínica</h3><p>Dúvidas sobre o acompanhamento ou o acordo com a clínica.</p><a class="b g" href="'+wa+'">Chamar no WhatsApp</a></div>':'');
 const aprender='<div class="c"><h3>Como usar o Elayon</h3><div id="trU"></div></div>';
 const ini0=pr?'pf':Elx.abaSalva('in'),ini=(!lib&&['ta','cl'].includes(ini0))?'in':ini0;
 Elx.abas(A,[{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'},{id:'in',t:'Início',html:inicio},{id:'ta',t:'Tarefas'+(n?' ('+n+')':''),html:tarefas},{id:'cl',t:'Clínica',html:clinica},{id:'ap',t:'Aprender'+(P.treino_usuario_em?'':' •'),html:aprender}].filter(x=>lib||!['ta','cl'].includes(x.id)),ini);
 const FERR='<div class="c"><h3>Minha ferramenta</h3><p>Treino e uso: grave a sua fala e observe os seus ritmos e silêncios, com a sua IA. As 10 últimas sessões ficam só neste aparelho e você pode apagar quando quiser. Ao concluir uma tarefa, o resultado vai para a clínica.</p><button class="b" id="fAb">Abrir a ferramenta aqui</button><div id="fBox"></div><button class="b g" id="fCal" style="margin-top:8px"'+(sc.calibrado?' disabled':'')+'>'+(sc.calibrado?'Calibração concluída ✓':'Concluí a calibração')+'</button><div class="msg" id="fCm"></div></div>';
 await Elx.perfil($('pfBox'),{anamnese:true,suporte:'paciente',topo:FERR,aoSalvar:()=>{setTimeout(()=>location.reload(),900)}});
 const fc=$('fCal');if(fc)fc.onclick=async()=>{fc.disabled=true;try{await rpc('usuario_calibrei');location.reload()}catch(e){$('fCm').className='msg er';$('fCm').textContent=msg(e);fc.disabled=false}};
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const t=document.querySelector('[data-tab="'+b.dataset.go+'"],[data-t="'+b.dataset.go+'"]');if(t)t.click()});
 const cdb=$('cdB');if(cdb)cdb.onclick=async()=>{cdb.disabled=true;try{const r=await rpc('usuario_vincular_codigo',{p_codigo:$('cdM').value.trim()});if(!r.ok)throw new Error(r.erro==='paciente_ja_tem_medico'?'Você já está ligado a outro médico.':'Código não encontrado.');location.reload()}catch(e){$('cdMs').className='msg er';$('cdMs').textContent=e.message;cdb.disabled=false}};
 const lbb=$('pdLb');if(lbb)lbb.onclick=async()=>{lbb.disabled=true;try{await rpc('usuario_pedir_liberacao');location.reload()}catch(e){$('pdLm').className='msg er';$('pdLm').textContent=msg(e);lbb.disabled=false}};
 $('fAb').onclick=()=>{if(blq){$('fBox').innerHTML='<div class="alerta">Ferramenta bloqueada: faça primeiro os exercícios com prazo vencido (aba Tarefas).</div>';return}if(!ia){const b=$('fBox');b.innerHTML='<div class="alerta">Coloque a sua IA mais abaixo, em “Minha IA”, e salve. Depois abra a ferramenta.</div>';return}$('fBox').innerHTML='<iframe src="/cockpit.html" allow="microphone" style="width:100%;height:78vh;border:1px solid var(--l);border-radius:12px;margin-top:8px"></iframe><a class="b g" style="margin-top:8px" href="/cockpit.html">Abrir em tela cheia</a>';$('fAb').hidden=true};
 const pdb=$('pdAt');if(pdb)pdb.onclick=async()=>{pdb.disabled=true;try{await rpc('usuario_pedir_atualizacao');location.reload()}catch(e){pdb.disabled=false;$('pdM').className='msg er';$('pdM').textContent=msg(e)}};
 const ab=$('abreF');if(ab)ab.onclick=()=>{const b=document.querySelector('[data-tb="pf"]');b&&b.click();$('fAb').click();scrollTo(0,0)};
 const go=()=>{const b=document.querySelector('[data-tb="pf"]');b&&b.click();scrollTo(0,0)};['vaiP','vaiP2'].forEach(i=>{const b=$(i);if(b)b.onclick=go});
 const trf=()=>rpc('usuario_treino_ok').then(()=>location.reload()).catch(()=>{});const trd=Elx.treino($('trU'),'elx_tr_usuario',PASSOS,trf);if(trd&&!P.treino_usuario_em)trf();
 const ob=$('obsB');if(ob)ob.onclick=async()=>{const v=$('obs').value.trim(),m=$('obsM');m.className='msg';m.textContent='';if(!v){m.className='msg er';m.textContent='Escreva a observação.';return}ob.disabled=true;try{await rpc('usuario_enviar_clinica',{p_obs:v});m.className='msg ok';m.textContent='Enviado. A clínica vai conferir e encaminhar ao seu médico.';setTimeout(()=>location.reload(),1200)}catch(e){m.className='msg er';m.textContent=msg(e);ob.disabled=false}};
});
</script></body></html>
