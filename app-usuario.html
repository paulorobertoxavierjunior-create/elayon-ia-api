<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon</title><link rel="manifest" href="/app-usuario.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-usuario.png"><link rel="icon" href="/icons/icon-usuario-192.png"><meta name="theme-color" content="#2a9d8f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
Elx.inicia({tipo:'usuario',nome:'Elayon',cor:'#2a9d8f',titulo:'Bem-vindo ao Elayon',frase:'Seu espaço de escuta e aprendizagem. O acesso é por convite do seu médico.'},async(u)=>{
 const A=$('app');A.innerHTML='<div class="c"><h2>Olá!</h2><p>Carregando seu espaço…</p></div>';
 let pend=[],med=[],laud=[],cs={status:'sem_caso'};try{pend=await rpc('treinos_pendentes')}catch(e){}try{med=await rpc('meus_medicos')}catch(e){}try{laud=await rpc('meus_laudos_certificados')}catch(e){}try{cs=await rpc('caso_atual')}catch(e){}
 const n=(pend||[]).length,st=cs.status||'sem_caso',lib=!!cs.liberado;
 const M={sem_caso:lib?['Seu acesso está liberado','A clínica certificou o laudo do seu médico. Faça os exercícios que ele preparou e use a sua ferramenta.']:['Aguardando a clínica','A sua clínica ainda está avaliando o laudo do seu médico. Você será avisado aqui.'],na_clinica:['Recebemos os seus exercícios','A clínica recebeu o seu resultado e vai encaminhá-lo ao seu médico.'],encaminhado:['Seu médico está avaliando','O resultado foi encaminhado '+(cs.medico?'a '+cs.medico:'ao seu médico')+'. Você vê a resposta aqui.'],reavaliar:['Seu médico pediu novos exercícios',cs.nota||'Abra o seu espaço e faça os novos exercícios.'],alta:['Alta','Seu médico concluiu esta etapa.'+(cs.nota?' Recado: '+cs.nota:'')]}[st]||['Acompanhamento',''];
 const wa=cs.clinica_whatsapp?'https://wa.me/'+(String(cs.clinica_whatsapp).length<=11?'55':'')+cs.clinica_whatsapp+'?text='+encodeURIComponent('Olá, sou usuário do Elayon e queria falar com a clínica.'):'';
 A.innerHTML='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Meu espaço</h1><p>'+(cs.clinica?'Acompanhamento de '+esc(cs.clinica)+'. ':'')+'Aqui você faz os exercícios que o seu médico preparou e aprende no seu ritmo.</p></div>'
  +'<div class="c"><div class="r" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>'+esc(M[0])+'</h3><span class="pill'+(st==='alta'?' ok':'')+'">'+(cs.ciclo?'etapa '+cs.ciclo:'início')+'</span></div><p>'+esc(M[1])+'</p></div>'
  +((lib&&(st==='sem_caso'||st==='reavaliar'||n))?'<div class="c"><h3>'+(n?'Você tem '+n+' atividade'+(n>1?'s':'')+' para fazer':'Nenhuma atividade no momento')+'</h3><p>'+(n?'Toque para começar. É rápido e você pode parar quando quiser.':'Quando o seu médico enviar algo novo, aparece aqui.')+'</p><a class="b" href="/meu-espaco.html">Abrir meu espaço</a></div>':'')
  +'<div class="c"><h3>Minha ferramenta</h3>'+(lib?'<p>Liberada pela sua clínica. Use quando quiser para observar o seu ritmo e os seus silêncios.</p><a class="b" href="/cockpit.html">Abrir minha ferramenta</a>':'<p>Será liberada quando a clínica certificar o laudo do seu médico.</p><button class="b g" disabled>Aguardando a clínica</button>')+'</div>'
  +'<div class="c"><h3>Meu médico</h3>'+((med||[]).length?med.map(m=>'<div class="it"><div class="r"><b>'+esc(m.medico)+'</b><span class="pill ok">vinculado</span></div></div>').join(''):'<p>Seu médico aparece aqui depois do primeiro atendimento.</p>')+'</div>'
  +'<div class="c"><h3>Meus laudos</h3><p>'+((laud||[]).length?(laud.length+' laudo(s) certificado(s) por '+esc(laud[0].clinica_nome||'sua clínica')+'.'):'Quando um laudo for certificado, você o vê aqui.')+'</p></div>'
  +(wa?'<div class="c"><h3>Falar com a clínica</h3><p>Dúvidas sobre o seu acompanhamento ou sobre o acordo com a clínica.</p><a class="b g" href="'+wa+'">Chamar no WhatsApp</a></div>':'')
  +'<p class="cen hint">Este app é uma ferramenta de acompanhamento e aprendizagem. Não faz diagnóstico: quem responde pelo cuidado é o seu médico.</p>';
});
</script></body></html>
