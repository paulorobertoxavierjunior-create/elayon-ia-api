<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elayon Space • Criar Cadastro</title>
  <style>
    :root{
      --bg1:#eaf7e3; --bg2:#dff4f6; --card:#ffffff;
      --ink:#0a2a2f; --muted:#4a6b70; --line:#cfe4e7;
      --accent:#66c7c0; --accent2:#7bd490; --shadow:0 10px 30px rgba(0,0,0,.08);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,sans-serif;
      background: radial-gradient(circle at top left, var(--bg1), var(--bg2));
      color:var(--ink);
    }
    .card{
      width:100%; max-width:460px; background:var(--card);
      border:1px solid var(--line); border-radius:24px; padding:40px 30px;
      box-shadow:var(--shadow);
    }
    h1{ font-size:26px; letter-spacing:-1px; margin-bottom:8px; text-align:center; }
    p{ color:var(--muted); font-size:14px; text-align:center; margin-bottom:24px; }
    .input-group{ margin-bottom:16px; text-align:left; }
    label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink); }
    input{
      width:100%; padding:14px; border:1px solid var(--line); border-radius:12px;
      font-size:15px; outline:none; transition:.2s;
    }
    input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(102,199,192,0.15); }
    .btn{
      display:block; width:100%; padding:16px; border:none; border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:var(--ink); font-size:16px; font-weight:800; cursor:pointer;
      transition:.2s ease; margin-top:10px; text-align:center; text-decoration:none;
    }
    .btn:hover{ transform:translateY(-2px); }
    .back-link{ display:block; text-align:center; margin-top:20px; font-size:14px; color:var(--muted); text-decoration:none; }
    .back-link:hover{ color:var(--ink); text-decoration:underline; }
    #error-msg{ color:#d9534f; font-size:13px; text-align:center; margin-bottom:12px; display:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Criar Conta</h1>
    <p>Preencha os dados para iniciar no ecossistema Elayon.</p>

    <div id="error-msg"></div>

    <form id="signup-form">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com" />
      </div>
      <div class="input-group">
        <label for="password">Palavra-passe</label>
        <input type="password" id="password" required placeholder="Mínimo de 6 carateres" />
      </div>
      <button type="submit" class="btn">Registar Conta</button>
    </form>

    <a class="back-link" href="login.html">← Já tenho uma conta (Entrar)</a>
  </main>

  <!-- Script Supabase (Certifica-te de ajustar com as tuas chaves públicas Anon) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xlktkelumptugiidnecbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsa3RrZWx1bXRwdWdpZG5lY2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzU4OTgsImV4cCI6MjEwNjM1MTg5OH0.EIn9oiFl7PmhYhaMlvYKljeFVZflRCbxD_HT65-88XM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('signup-form');
    const errorDiv = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: window.location.origin + '/confirmacao.html'
        }
      });

      if (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      } else {
        // Redireciona para a página de aviso de verificação de e-mail
        window.location.href = 'check-email.html';
      }
    });
  </script>
</body>
</html>
