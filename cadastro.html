<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elayon Space — Cadastro & Alocação</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #6366f1; --primary-hover: #4f46e5; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --success: #22c55e; --error: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--card); padding: 35px 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); border: 1px solid var(--border); }
        <h2> { text-align: center; margin-bottom: 6px; font-size: 20px; }
        p.subtitle { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 24px; }
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .msg { font-size: 12px; text-align: center; margin-top: 12px; line-height: 1.4; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 12px; }
        .footer-link a { color: var(--muted); text-decoration: none; }
        .footer-link a:hover { color: var(--text); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Conta Simbiótica</h2>
        <p class="subtitle">Alocação de ID e Tokens Iniciais</p>

        <input type="text" id="fullName" placeholder="Nome Completo / Identificação">
        <input type="email" id="email" placeholder="E-mail de Confirmação">
        <input type="password" id="password" placeholder="Senha Segura">
        <button onclick="realizarCadastro()">Inicializar Perfil & Tokens</button>

        <div id="msg" class="msg"></div>

        <div class="footer-link">
            <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Já possui conta? Ir para Login</a>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            'https://xlktkelumptugiidnecbj.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsa3RrZWx1bXRwdWdpZG5lY2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzU4OTgsImV4cCI6MjEwNjM1MTg5OH0.EIn9oiFl7PmhYhaMlvYKljeFVZflRCbxD_HT65-88XM'
        );

        async function realizarCadastro() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');

            if (!fullName || !email || !password) {
                msg.style.color = 'var(--error)';
                msg.textContent = 'Preencha todos os campos obrigatórios.';
                return;
            }

            msg.style.color = 'var(--muted)';
            msg.textContent = 'Processando registro e disparando e-mail de confirmação...';

            try {
                // Cadastro no Auth do Supabase com redirecionamento de confirmação
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: { 
                        data: { full_name: fullName },
                        emailRedirectTo: window.location.origin + '/login.html'
                    }
                });

                if (authError) throw authError;

                const userId = authData.user?.id;
                if (userId) {
                    // Alocação inicial de ID, Papel e Tokens na tabela profiles
                    await supabaseClient.from('profiles').upsert({
                        id: userId,
                        full_name: fullName,
                        user_role: 'usuario',
                        tokens_balance: 100
                    });
                }

                msg.style.color = 'var(--success)';
                msg.textContent = 'Cadastro realizado! Verifique sua caixa de entrada para confirmar o e-mail. 100 tokens alocados.';
            } catch (err) {
                msg.style.color = 'var(--error)';
                msg.textContent = 'Erro: ' + err.message;
            }
        }
    </script>
</body>
</html>
