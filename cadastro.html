<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elayon Space — Cadastro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #0284c7; --text: #1e293b; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--card); width: 100%; max-width: 400px; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); border: 1px solid var(--border); }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .sub { font-size: 13px; color: #64748b; margin-bottom: 25px; }
        .group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
        input:focus { outline: none; border-color: var(--primary); background: #fff; }
        .btn { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .msg { margin-top: 15px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Criar Conta</h1>
        <div class="sub">Junte-se ao ecossistema Elayon Space.</div>

        <div class="group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" value="paulorobertoxavierjunior@gmail.com">
        </div>
        <div class="group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" value="123456">
        </div>

        <button class="btn" onclick="realizarCadastro()">Cadastrar</button>
        <div id="msgRetorno" class="msg"></div>
    </div>

    <script>
        // Credenciais protegidas embutidas para o fluxo do front-end
        const SUPABASE_URL = "https://xlktkelumptugiidnecbj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsa3RrZWx1bXRwdWdpZG5lY2JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzU4OTgsImV4cCI6MjEwNjM1MTg5OH0.EIn9oiFl7PmhYhaMlvYKljeFVZflRCbxD_HT65-88XM";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function realizarCadastro() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('senha').value.trim();
            const msgRetorno = document.getElementById('msgRetorno');

            msgRetorno.style.color = '#1e293b';
            msgRetorno.innerText = 'Processando cadastro...';

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                msgRetorno.style.color = '#dc2626';
                msgRetorno.innerText = `Erro: ${error.message}`;
            } else {
                msgRetorno.style.color = '#16a34a';
                msgRetorno.innerText = 'Sucesso! Verifique seu e-mail ou faça login.';
            }
        }
    </script>
</body>
</html>
