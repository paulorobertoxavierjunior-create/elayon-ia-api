<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Clínica</title><link rel="icon" href="/icons/logo-emblema.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app-core.js"></script><script src="/v2-core.js"></script>
<script>
V2.porta({nome:'Elayon Clínica',cor:'#0b7285',papel:'master',titulo:'Elayon Clínica',frase:'Você é a clínica e o médico. Cadastra o paciente, atende, valida o laudo e libera o app dele.'},async(u)=>{
 let K=await rpc('c2_minha_clinica');let L=[];if(K)L=await rpc('c2_pacientes')||[];
 const ST={cadastrado:['Cadastrado',''],em_consulta:['Em consulta','pill'],liberado:['Liberado','pill ok']};
 const link=c=>location.origin+'/paciente2.html?c='+c;
 const fClin='<div class="c"><h3>'+(K?'Dados da clínica e do médico':'Cadastre a sua clínica')+'</h3><label>Nome da clínica</label><input id="kN" value="'+esc(K&&K.nome||'')+'"><label>Nome do médico</label><input id="kM" value="'+esc(K&&K.medico_nome||'')+'"><label>CRM ou conselho</label><input id="kR" value="'+esc(K&&K.registro||'')+'"><label>WhatsApp da clínica</label><input id="kW" inputmode="tel" value="'+esc(K&&K.whatsapp||'')+'"><button class="b" id="kS">Salvar clínica</button><div class="msg" id="kMs"></div></div>';
 const pac=K?'<div class="c"><h3>Novo paciente</h3><label>Nome</label><input id="pN"><label>E-mail (opcional)</label><input id="pE" type="email"><label>WhatsApp</label><input id="pW" inputmode="tel"><button class="b" id="pS">Cadastrar e gerar o link</button><div class="msg" id="pMs"></div></div>'
  +'<div id="pL" style="display:grid;gap:10px">'+(L.length?L.map(p=>'<div class="it"><div class="r"><b>'+esc(p.nome)+'</b><span class="'+ST[p.status][1]+'" '+(ST[p.status][1]?'':'')+'>'+ST[p.status][0]+'</span></div><small>'+(p.entrou?'Já entrou no app':'Ainda não entrou')+' · código '+esc(p.codigo)+(p.tarefas_pendentes?' · tarefa pendente':'')+(p.tarefas_enviadas&&p.tarefas_enviadas.length?' · tarefa enviada ✓':'')+'</small>'+(p.tarefas_enviadas&&p.tarefas_enviadas.length?'<details><summary>Ver resposta do paciente</summary><p style="white-space:pre-wrap;font-size:13px">'+esc(p.tarefas_enviadas[0].resposta)+'</p></details>':'')+'<div class="g2"><button class="b g" data-cp="'+esc(p.codigo)+'">Copiar link</button><a class="b g" href="'+V2.wa(p.whatsapp,'Olá '+p.nome.split(' ')[0]+', este é o seu acesso ao app da '+(K.nome)+': '+link(p.codigo))+'">Enviar no WhatsApp</a></div></div>').join(''):'<div class="c"><small>Nenhum paciente ainda.</small></div>')+'</div>':'<div class="alerta">Cadastre a clínica primeiro, na aba Clínica.</div>';
 const consulta=K?'<div class="c"><h3>Consulta e laudo</h3><label>Paciente</label><select id="cP">'+L.map(p=>'<option value="'+p.id+'">'+esc(p.nome)+' · '+ST[p.status][0]+'</option>').join('')+'</select><label>Laudo</label><textarea id="cT" rows="9" placeholder="Escreva ou dite o laudo da consulta"></textarea><button class="b g" id="cS">Salvar rascunho</button><label>Assinatura do médico</label><input id="cA" value="'+esc((K.medico_nome||'')+(K.registro?' · '+K.registro:''))+'"><button class="b" id="cV">Validar, assinar e liberar o app do paciente</button><div class="msg" id="cMs"></div></div><div class="c"><h3>Tarefa para o paciente</h3><p>Enquanto a tarefa não for enviada, a ferramenta do paciente fica travada. Quando ele envia, a ferramenta abre para uso livre com a IA dele.</p><label>Título</label><input id="tT" placeholder="Ex.: Leitura em voz alta"><label>Orientação</label><textarea id="tO" rows="4"></textarea><label>Prazo (dias)</label><input id="tD" inputmode="numeric" value="3"><button class="b" id="tS">Enviar tarefa ao paciente</button><div class="msg" id="tMs"></div></div>':'<div class="alerta">Cadastre a clínica primeiro.</div>';
 const ajuda='<div class="c"><h3>Como usar</h3><div class="step"><div class="n">1</div><p>Aba Perfil: coloque a sua IA. Depois cadastre a clínica.</p></div><div class="step"><div class="n">2</div><p>Aba Pacientes: cadastre antes da consulta. O sistema gera o link do paciente.</p></div><div class="step"><div class="n">3</div><p>Aba Consulta: escreva o laudo, salve, assine e libere. O paciente já pode abrir o app dele.</p></div><div class="step"><div class="n">4</div><p>Consumo: acompanhe quem usou quantos tokens e quando.</p></div><a class="b g" href="/advanced2.html">Abrir o painel de consumo (Advanced 2)</a></div>';
 const aba=Elx.abas($('app'),[{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'},{id:'kl',t:'Clínica',html:fClin},{id:'pc',t:'Pacientes'+(L.length?' ('+L.length+')':''),html:pac},{id:'cs',t:'Consulta',html:consulta},{id:'ajuda',t:'Ajuda',html:ajuda}],K?'pc':'kl');
 Elx.perfil($('pfBox'),{oficial:false});
 const say=(id,t,e)=>{const m=$(id);m.className='msg '+(e?'er':'ok');m.textContent=t};
 $('kS').onclick=async()=>{try{await rpc('c2_criar_clinica',{p_nome:$('kN').value,p_medico:$('kM').value,p_registro:$('kR').value,p_whatsapp:$('kW').value});location.reload()}catch(e){say('kMs',msg(e),1)}};
 const ps=$('pS');if(ps)ps.onclick=async()=>{try{await rpc('c2_cadastrar_paciente',{p_nome:$('pN').value,p_email:$('pE').value,p_whatsapp:$('pW').value});location.reload()}catch(e){say('pMs',msg(e),1)}};
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{V2.copiar(link(b.dataset.cp));b.textContent='Link copiado'});
 const cp=$('cP');if(cp){const pu=()=>{const p=L.find(x=>x.id===cp.value);$('cT').value=p?p.texto:''};cp.onchange=pu;pu();
  $('cS').onclick=async()=>{try{await rpc('c2_salvar_laudo',{p_paciente:cp.value,p_texto:$('cT').value});say('cMs','Rascunho salvo.')}catch(e){say('cMs',msg(e),1)}};
  $('tS').onclick=async()=>{try{await rpc('c2_criar_tarefa',{p_paciente:cp.value,p_titulo:$('tT').value,p_orientacao:$('tO').value,p_dias:parseInt($('tD').value)||3});say('tMs','Tarefa enviada ao paciente.');$('tT').value='';$('tO').value=''}catch(e){say('tMs',msg(e),1)}};
  $('cV').onclick=async()=>{try{await rpc('c2_salvar_laudo',{p_paciente:cp.value,p_texto:$('cT').value});await rpc('c2_validar_laudo',{p_paciente:cp.value,p_assinatura:$('cA').value});say('cMs','Laudo validado. O app do paciente está liberado.');setTimeout(()=>location.reload(),1200)}catch(e){say('cMs',msg(e),1)}}}
});
</script></body></html>
