<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Master</title><link rel="manifest" href="/app-master.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-master.png"><link rel="icon" href="/icons/icon-master-192.png"><meta name="theme-color" content="#0e5e66"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Master"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
let P=null,ME='';
Elx.inicia({tipo:'candidato',nome:'Elayon Master',cor:'#0e5e66',titulo:'Elayon Master',frase:'Responsável pela sua operação. O acesso é por convite do Advanced.'},async(u)=>{
 ME=u.id;const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let T={treino:{},cred:{}};try{T=await rpc('minha_trilha')}catch(e){}
 if(!(T.cred&&T.cred.master))return jornada(T);
 try{await rpc('master_clinica')}catch(e){}
 painel();
});
function jornada(T){const t=T.treino||{},c=T.cred||{};
 const S=[['Conhecer a ferramenta e calibrar','Treine como usuário e calibre de verdade. Quando passar, pede a credencial.',!!t.medico,'/trilha.html?p=piloto'],
  ['Credencial e cadastro oficial de médico','Com a credencial liberada, faça o registro oficial (CRM e conselho).',!!c.medico&&!!T.cadastro_piloto,'/trilha.html?p=piloto'],
  ['Treino da clínica','Use a ferramenta completa como tutorial, cadastrando um paciente de teste.',!!t.clinica,'/trilha.html?p=clinica'],
  ['Treino do master e avaliação','Perguntas uma de cada vez. Você refaz até acertar todas.',!!t.master,'/trilha.html?p=master'],
  ['Credencial de master','Com a avaliação aprovada, você pede a credencial e recebe o painel completo.',!!c.master,'/trilha.html?p=master']];
 const at=S.findIndex(s=>!s[2]);
 $('app').innerHTML='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Sua jornada</h1><p>Você começa conhecendo a ferramenta por dentro. A cada etapa aprovada, o Advanced libera a próxima credencial.</p></div>'
  +'<div class="c">'+S.map((s,i)=>'<div class="step '+(s[2]?'ok':i===at?'at':'')+'"><div class="n">'+(s[2]?'✓':i+1)+'</div><div><b>'+s[0]+'</b><p>'+s[1]+'</p></div></div>').join('')+'</div>'
  +(at>=0?'<a class="b" href="'+S[at][3]+'">Continuar: '+S[at][0]+'</a>':'')
  +'<button class="b g" onclick="location.reload()">Atualizar</button>'}
async function painel(tab){
 try{P=await rpc('meu_painel_master')}catch(e){$('app').innerHTML='<div class="c"><h2>Algo falhou</h2><p>'+esc(msg(e))+'</p></div>';return}
 let cv=[],cs=[],fl=[],md=[];try{cv=await rpc('meus_convites')}catch(e){}try{cs=await rpc('master_casos')}catch(e){}try{fl=await rpc('master_fluxo')}catch(e){}try{md=await rpc('master_medicos')}catch(e){}
 const ET=(...x)=>fl.filter(f=>x.includes(f.etapa)),atr=fl.filter(f=>f.etapa==='cadastrado'&&f.horas>=24),acoes=ET('aguardando_clinica','certificado').length+atr.length+md.filter(m=>m.status==='pendente').length;
 const dias=h=>h>=48?Math.floor(h/24)+' dias':h>=24?'1 dia':Math.max(0,Math.round(h))+' h',waU=(num,t)=>{const d=String(num||'').replace(/\D/g,'');return 'https://wa.me/'+(d?(d.length<=11?'55':'')+d:'')+'?text='+encodeURIComponent(t)};
 const ST={na_clinica:'a encaminhar',encaminhado:'com o médico',reavaliar:'novos exercícios',alta:'alta'},cnt=s=>cs.filter(x=>x.status===s).length;
 const pc=P.preco_token_centavos||0,v=t=>pc?brl(Math.round(t*pc)):'—';
 $('app').innerHTML='<div class="tabs" id="tb"><button class="tab on" data-p="pn">Painel</button><button class="tab" data-p="fl">Fluxo'+(acoes?' ('+acoes+')':'')+'</button><button class="tab" data-p="md">Médicos'+(md.some(m=>m.status==='pendente')?' •':'')+'</button><button class="tab" data-p="cl">Clínica</button><button class="tab" data-p="cs">Casos'+(cnt('na_clinica')?' ('+cnt('na_clinica')+')':'')+'</button><button class="tab" data-p="co">Consumo</button><button class="tab" data-p="fe">Ferramentas</button></div>'
 +'<div class="pane on" id="p-pn">'+(P.saldo_baixo?'<div class="alerta">⚠️ Saldo baixo: restam '+P.saldo+' tokens. Fale com o Advanced para renovar. O app dos seus usuários continua disponível; só o que gasta token pausa.</div>':'')
  +'<div class="c"><h2>'+esc(P.nome)+'</h2><p>Você responde pela sua operação e paga o consumo todo. O usuário nunca é cobrado.</p><div class="kp"><div><b>'+P.saldo+'</b>tokens</div><div><b>'+(P.medicos||[]).length+'</b>médicos</div><div><b>'+P.usuarios+'</b>usuários</div></div>'
  +'<div class="kp"><div><b>'+P.laudos.enviados+'</b>laudos</div><div><b>'+P.laudos.certificados+'</b>certificados</div><div><b>'+P.laudos.pendentes+'</b>a certificar</div></div></div></div>'
 +'<div class="pane" id="p-fl"><div class="c"><h3>Cadastrar paciente</h3><p>Você também atende. O paciente esteve na clínica e recebeu a instrução; cadastre aqui e vá ao atendimento.</p><input id="pN" placeholder="Nome do paciente"><input id="pE" type="email" placeholder="E-mail do paciente"><input id="pW" type="tel" placeholder="WhatsApp (opcional)"><button class="b" id="pB">Cadastrar e ir ao atendimento</button><div class="msg" id="pM"></div></div>'
  +'<div class="c"><h3>Aguardando a sua avaliação ('+ET('aguardando_clinica').length+')</h3>'+(ET('aguardando_clinica').map(f=>'<div class="it"><div class="r"><b>'+esc(f.paciente)+'</b><span class="pill'+(f.horas>=24?' er':'')+'">'+dias(f.horas)+'</span></div><small>laudo de '+esc(f.medico)+'</small></div>').join('')||'<p>Nenhum laudo esperando.</p>')+(ET('aguardando_clinica').length?'<a class="b" href="/clinica.html">Avaliar e certificar na clínica</a>':'')+'</div>'
  +'<div class="c"><h3>Certificados: liberar o link ao usuário ('+ET('certificado','liberado').length+')</h3>'+(ET('certificado','liberado').map(f=>'<div class="it"><div class="r"><b>'+esc(f.paciente)+'</b><span class="pill'+(f.etapa==='liberado'?' ok':'')+'">'+(f.etapa==='liberado'?'link enviado':'certificado')+'</span></div><small>'+esc(f.email)+' · '+esc(f.medico)+'</small><button class="b'+(f.etapa==='liberado'?' g':'')+'" data-lib="'+f.laudo_id+'">'+(f.etapa==='liberado'?'Reenviar o link':'Liberar ao usuário')+'</button><div id="lb-'+f.laudo_id+'"></div></div>').join('')||'<p>Nada para liberar agora.</p>')+'<div class="msg" id="lbM"></div></div>'
  +'<div class="c"><h3>Atrasados com o médico ('+atr.length+')</h3><p>Pacientes cadastrados há mais de 24 horas sem laudo enviado à clínica.</p>'+(atr.map(f=>'<div class="it"><div class="r"><b>'+esc(f.paciente)+'</b><span class="pill er">'+dias(f.horas)+'</span></div><small>com '+esc(f.medico)+'</small><a class="b g" href="'+waU('','Dr(a). '+f.medico+', o paciente '+f.paciente+' foi cadastrado há '+dias(f.horas)+' e o laudo ainda não chegou à clínica. Consegue enviar hoje?')+'">Cobrar o médico no WhatsApp</a></div>').join('')||'<p>Ninguém atrasado.</p>')+'</div>'
  +'<div class="c"><h3>Em andamento e concluídos</h3>'+(ET('cadastrado','recusado','usuario_ativo').filter(f=>!(f.etapa==='cadastrado'&&f.horas>=24)).map(f=>'<div class="it"><div class="r"><b>'+esc(f.paciente)+'</b><span class="pill'+(f.etapa==='usuario_ativo'?' ok':f.etapa==='recusado'?' er':'')+'">'+({cadastrado:'a atender',recusado:'recusado',usuario_ativo:'usuário ativo'})[f.etapa]+'</span></div><small>'+esc(f.medico)+(f.etapa==='recusado'&&f.motivo?' · motivo: '+esc(f.motivo):'')+'</small>'+((f.etapa==='cadastrado'||f.etapa==='recusado')&&f.medico_id===ME?'<a class="b g" href="/piloto-guiado.html?modo=real&pn='+encodeURIComponent(f.paciente)+'&pe='+encodeURIComponent(f.email)+'">Atender</a>':'')+'</div>').join('')||'<p>Nada aqui ainda.</p>')+'</div></div>'
 +'<div class="pane" id="p-md"><div class="c"><h3>Convidar um médico</h3><p>O médico abre o app Elayon Médico com o convite e se cadastra. Você aceita aqui e só então ele recebe a ferramenta.</p><input id="mN" placeholder="Nome do médico"><button class="b" id="mB">Gerar convite de médico</button><div id="mR"></div><div class="msg" id="mM"></div></div>'
  +'<div class="c"><h3>Seus médicos</h3>'+(md.map(m=>'<div class="it"><div class="r"><b>'+esc(m.nome)+'</b><span class="pill'+(m.status==='ativo'?' ok':m.status==='recusado'?' er':'')+'">'+(m.status==='pendente'?'aguardando aceite':m.status)+'</span></div><small>'+esc(m.email||'')+' · '+m.pacientes+' paciente(s) · '+m.laudos+' laudo(s)</small>'+(m.status!=='ativo'?'<button class="b" data-dm="'+m.id+'" data-ok="1">Aceitar</button>':'')+(m.status!=='recusado'?'<button class="b g" data-dm="'+m.id+'" data-ok="0">'+(m.status==='ativo'?'Desvincular':'Recusar')+'</button>':'')+'</div>').join('')||'<p>Nenhum ainda. Gere um convite acima.</p>')+'<div class="msg" id="dmM"></div></div>'
  +'<div class="c"><h3>Convites emitidos</h3>'+(cv.map(x=>'<div class="it"><div class="r"><b>'+esc(x.para_nome||x.tipo)+'</b><span class="pill'+(x.usado_em?' ok':'')+'">'+(x.usado_em?'usado':'aberto')+'</span></div><small>'+x.tipo+' · '+esc(x.codigo)+(x.usado_por_nome?' · '+esc(x.usado_por_nome):'')+'</small></div>').join('')||'<p>Nenhum.</p>')+'</div></div>'
 +'<div class="pane" id="p-cl"><div class="c"><h3>'+esc((P.clinica||{}).nome||'Sua clínica')+'</h3><p>A clínica é uma aba sua: aqui chegam os laudos dos seus médicos para você conferir, certificar e liberar.</p><div class="kp"><div><b>'+P.laudos.pendentes+'</b>a certificar</div><div><b>'+P.laudos.certificados+'</b>certificados</div><div><b>'+P.laudos.enviados+'</b>recebidos</div></div><a class="b" href="/clinica.html">Receber e certificar laudos</a><a class="b g" href="/supervisao.html">Supervisão dos usuários</a></div>'
  +'<div class="c"><h3>Fale com a clínica</h3><p>O usuário combina o acompanhamento com você. Com o seu WhatsApp aqui, o app dele ganha o botão para falar com a clínica.</p><input id="wZ" type="tel" placeholder="WhatsApp da clínica (com DDD)" value="'+esc((P.clinica||{}).whatsapp||'')+'"><button class="b g" id="wB">Salvar WhatsApp</button><div class="msg" id="wM"></div></div></div>'
 +'<div class="pane" id="p-cs"><div class="c"><h3>Casos dos seus usuários</h3><p>Quando o usuário conclui os exercícios, o resultado chega aqui. Você encaminha ao médico que já está vinculado a ele.</p><div class="kp"><div><b>'+cnt('na_clinica')+'</b>a encaminhar</div><div><b>'+cnt('encaminhado')+'</b>com o médico</div><div><b>'+cnt('alta')+'</b>altas</div></div></div>'
  +'<div class="c">'+(cs.map(x=>'<div class="it"><div class="r"><b>'+esc(x.paciente)+'</b><span class="pill'+(x.status==='alta'?' ok':'')+'">'+ST[x.status]+' · etapa '+x.ciclo+'</span></div><small>'+String(x.criado).slice(0,10)+(x.medico?' · '+esc(x.medico):'')+'</small>'+((x.status==='na_clinica'||x.status==='encaminhado')?((x.candidatos||[]).length?'<select id="sel-'+x.id+'">'+x.candidatos.map(m=>'<option value="'+m.id+'"'+(m.id===x.medico_id?' selected':'')+'>'+esc(m.nome)+'</option>').join('')+'</select><button class="b" data-enc="'+x.id+'">'+(x.status==='encaminhado'?'Reencaminhar':'Encaminhar ao médico')+'</button>':'<small>Nenhum médico da sua clínica está vinculado a este usuário.</small>'):'')+'</div>').join('')||'<p>Nenhum caso ainda.</p>')+'<div class="msg" id="csM"></div></div></div>'
 +'<div class="pane" id="p-co"><div class="c"><h3>Consumo dos últimos 30 dias</h3><p>Você paga tudo. Os valores abaixo são só para a sua gestão.</p><div class="kp"><div><b>'+P.consumo_30d+'</b>tokens</div><div><b>'+v(P.consumo_30d)+'</b>valor</div><div><b>'+P.saldo+'</b>saldo</div></div></div>'
  +'<div class="c"><h3>Por médico</h3>'+((P.medicos||[]).map(m=>'<div class="it"><div class="r"><b>'+esc(m.nome)+'</b><b>'+v(m.tokens_30d)+'</b></div><small>'+m.tokens_30d+' tokens dos usuários dele</small></div>').join('')||'<p>Sem consumo.</p>')+'</div></div>'
 +'<div class="pane" id="p-fe"><div class="c"><h3>Ferramentas</h3><a class="b" href="/piloto.html">Atender como médico</a><a class="b g" href="/cockpit.html">Cockpit para treinar médicos</a><a class="b g" href="/master.html">Dashboard e metadados</a><a class="b g" href="/master-treino.html">Rever o meu treinamento</a></div></div>';
 $('tb').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+b.dataset.p))};
 const conv=async(tipo,ni,res,msgEl)=>{const n=$(ni).value.trim();if(!n)return;try{const c=await rpc('gerar_convite',{p_tipo:tipo,p_nome:n});const app=tipo==='medico'?'app-medico.html':'app-usuario.html';const txt='Convite Elayon para '+n+': '+c+' · abra '+location.origin+'/'+app;
  $(res).innerHTML='<div class="cod">'+esc(c)+'</div><a class="b g" style="margin-top:8px" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Enviar por WhatsApp</a>';if(msgEl){$(msgEl).className='msg ok';$(msgEl).textContent='Válido por 7 dias, uso único.'}}catch(e){if(msgEl){$(msgEl).className='msg er';$(msgEl).textContent=msg(e)}}};
 $('p-cs').onclick=async e=>{const id=(e.target.dataset||{}).enc;if(!id)return;e.target.disabled=true;try{await rpc('master_encaminhar',{p_caso:id,p_medico:$('sel-'+id).value});painel('cs')}catch(er){$('csM').className='msg er';$('csM').textContent=msg(er);e.target.disabled=false}};
 if(tab){const bt=document.querySelector('.tab[data-p="'+tab+'"]');if(bt)bt.click()}
 $('mB').onclick=()=>conv('medico','mN','mR','mM');
 $('pB').onclick=async()=>{const n=$('pN').value.trim(),e=$('pE').value.trim().toLowerCase(),w=$('pW').value.trim(),m=$('pM');m.className='msg';m.textContent='';if(!n||!e){m.className='msg er';m.textContent='Digite o nome e o e-mail.';return}
  $('pB').disabled=true;try{await rpc('medico_cadastrar_paciente',{p_nome:n,p_email:e,p_whatsapp:w});location.href='/piloto-guiado.html?modo=real&pn='+encodeURIComponent(n)+'&pe='+encodeURIComponent(e)}catch(er){m.className='msg er';m.textContent=msg(er);$('pB').disabled=false}};
 $('p-fl').onclick=async e=>{const id=(e.target.dataset||{}).lib;if(!id)return;e.target.disabled=true;try{const r=await rpc('master_liberar_usuario',{p_laudo:id}),box=$('lb-'+id);
   if(r.usado){box.innerHTML='<small>O usuário já entrou no app.</small>'}else{const txt='Olá, '+r.nome+'. A sua clínica liberou o seu acesso ao Elayon. Abra '+location.origin+'/app-usuario.html?c='+r.codigo+' e entre com o e-mail '+r.email+'. O convite vale por 7 dias.';
    box.innerHTML='<div class="cod">'+esc(r.codigo)+'</div><a class="b g" style="margin-top:8px" href="'+waU(r.whatsapp,txt)+'">Enviar o link por WhatsApp</a>'}
   e.target.disabled=false;$('lbM').className='msg ok';$('lbM').textContent='Link gerado. Ele só funciona com o e-mail do paciente.'}catch(er){$('lbM').className='msg er';$('lbM').textContent=msg(er);e.target.disabled=false}};
 $('p-md').onclick=async e=>{const id=(e.target.dataset||{}).dm;if(!id)return;e.target.disabled=true;try{await rpc('master_decidir_medico',{p_medico:id,p_aceitar:e.target.dataset.ok==='1'});painel('md')}catch(er){$('dmM').className='msg er';$('dmM').textContent=msg(er);e.target.disabled=false}};
 $('wB').onclick=async()=>{try{await rpc('master_definir_whatsapp',{p_whatsapp:$('wZ').value});$('wM').className='msg ok';$('wM').textContent='Salvo.'}catch(er){$('wM').className='msg er';$('wM').textContent=msg(er)}}}
</script></body></html>
