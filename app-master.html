<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Master</title><link rel="manifest" href="/app-master.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-master.png"><link rel="icon" href="/icons/icon-master-192.png"><meta name="theme-color" content="#0e5e66"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Master"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
let P=null,ME='';
Elx.inicia({tipo:'candidato',nome:'Elayon Master',cor:'#0e5e66',titulo:'Elayon Master',frase:'Responsável pela sua operação. O acesso é por convite do Advanced.'},async(u)=>{
 ME=u.id;const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let T={treino:{},cred:{}};try{T=await rpc('minha_trilha')}catch(e){}
 if(!(T.cred&&T.cred.master))return jornada(T);
 try{await rpc('master_clinica')}catch(e){}
 painel();
});
function jornada(T){
 $('app').innerHTML='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Contrato e documentos</h1><p>Para operar como master, aceite o contrato (versão de teste) e preencha os documentos da sua operação. Ao enviar, você recebe a credencial para convidar médicos.</p></div>'
 +'<div class="c"><h3>Contrato de teste</h3><p style="white-space:pre-wrap">Versão de teste (teste-1). A Elayon Space cede o uso da plataforma ao master para operar a sua clínica. O master responde pela sua operação, paga todo o consumo de tokens da plataforma dele e convida os seus médicos. Este texto será substituído pelo contrato definitivo.</p></div>'
 +'<div class="c"><h3>Documentos</h3><input id="dR" placeholder="Razão social ou nome completo"><input id="dD" placeholder="CNPJ ou CPF"><input id="dP" placeholder="Responsável"><input id="dW" type="tel" placeholder="WhatsApp (com DDD)"><input id="dE" placeholder="Endereço (opcional)"><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="dK" type="checkbox" style="width:auto"> Li e aceito o contrato</label><input id="dA" placeholder="Digite o seu nome completo para assinar"><button class="b" id="dB">Enviar e receber a credencial</button><div class="msg" id="dM"></div></div>';
 $('dB').onclick=async()=>{const m=$('dM');m.className='msg';m.textContent='';if(!$('dK').checked){m.className='msg er';m.textContent=msg({message:'aceite_obrigatorio'});return}
  $('dB').disabled=true;try{await rpc('master_enviar_documentos',{p_dados:{razao:$('dR').value.trim(),documento:$('dD').value.trim(),responsavel:$('dP').value.trim(),whatsapp:$('dW').value.trim(),endereco:$('dE').value.trim()},p_aceite:$('dA').value.trim()});location.reload()}catch(e){m.className='msg er';m.textContent=msg(e);$('dB').disabled=false}}}
const PASSOS=[['A sua IA e o seu perfil','No Perfil, coloque a chave da sua própria IA e o cadastro profissional. Isso vale para tudo que você usar aqui.'],['A operação em uma tela','A aba Fluxo mostra tudo que espera por você: casos a validar, devoluções dos médicos para liberar e atrasos para cobrar.'],['Convidar médicos','Na aba Médicos, gere o convite. O médico se cadastra e você aceita. Só então ele recebe a ferramenta.'],['Você também atende','Na aba Pacientes você convida os seus próprios pacientes, como qualquer médico da sua clínica.'],['Validar e encaminhar','Quando o paciente envia algo, o caso chega ao Fluxo. Valide e encaminhe ao médico vinculado dele, ou dê OK se foi só um aviso.'],['Liberar as tarefas','O médico devolve laudo e tarefas. Você certifica o laudo na clínica e libera as tarefas: elas entram na fila do paciente.'],['Fechar o ciclo','Quando o paciente termina as tarefas, o resultado volta para você. Dando OK, a etapa termina.']];
async function painel(){
 let T={},cv=[],cs=[],fl=[],md=[];
 try{P=await rpc('meu_painel_master')}catch(e){$('app').innerHTML='<div class="c"><h2>Algo falhou</h2><p>'+esc(msg(e))+'</p></div>';return}
 try{T=await rpc('minha_trilha')}catch(e){}try{cv=await rpc('meus_convites')}catch(e){}try{cs=await rpc('master_casos')}catch(e){}try{fl=await rpc('master_fluxo')}catch(e){}try{md=await rpc('master_medicos')}catch(e){}
 let PF={};try{const r=await sb.from('profiles').select('nome,ai_key,ai_cfg').eq('id',ME).maybeSingle();PF=r.data||{}}catch(e){}
 const reg=!!T.cadastro_piloto,ia=!!(PF.ai_key||Object.keys(PF.ai_cfg||{}).some(k=>k[0]!=='_'&&(PF.ai_cfg[k]||{}).key));
 const by=s=>cs.filter(x=>x.status===s),medW=id=>((md.find(m=>m.id===id)||{}).whatsapp)||'';
 const ST={na_clinica:'a validar',encaminhado:'com o médico',reavaliar:'devolvido',em_tarefas:'em tarefas',concluido:'concluído',alta:'alta'};
 const atr=by('encaminhado').filter(x=>(fl.find(f=>f.caso_id===x.id)||{}).horas>=24);
 const acoes=by('na_clinica').length+by('reavaliar').length+atr.length+(P.laudos.pendentes>0?1:0)+md.filter(m=>m.status==='pendente').length;
 const pv=P.preco_token_centavos||0,v=t=>pv?brl(Math.round(t*pv)):'—';
 const casoCard=x=>{const f=fl.find(q=>q.caso_id===x.id)||{},h=f.horas||0;
  if(x.status==='na_clinica')return '<div class="it"><div class="r"><b>'+esc(x.paciente)+'</b><span class="pill'+(h>=24?' er':'')+'">'+HORAS(h)+'</span></div><small>'+(x.origem==='manual'?'enviou uma observação':x.origem==='voluntario'?'enviou exercícios voluntários':'concluiu as tarefas e enviou o resultado')+' · etapa '+x.ciclo+'</small>'+(x.obs_usuario?'<p style="white-space:pre-wrap">'+esc(x.obs_usuario)+'</p>':'')
   +((x.candidatos||[]).length?'<select id="sel-'+x.id+'">'+x.candidatos.map(m=>'<option value="'+m.id+'"'+(m.id===x.medico_id?' selected':'')+'>'+esc(m.nome)+'</option>').join('')+'</select><button class="b" data-enc="'+x.id+'">Validar e encaminhar ao médico</button>':'<small>Nenhum médico ativo da sua clínica está vinculado a este paciente.</small>')
   +'<button class="b g" data-conc="'+x.id+'">OK, concluir esta etapa</button></div>';
  if(x.status==='reavaliar')return '<div class="it"><div class="r"><b>'+esc(x.paciente)+'</b><span class="pill">'+HORAS(h)+'</span></div><small>devolvido por '+esc(x.medico||'médico')+(x.nota?' · “'+esc(x.nota)+'”':'')+'</small><small>'+x.tarefas_a_liberar+' tarefa(s) para liberar · '+x.laudos_a_certificar+' laudo(s) para certificar</small>'
   +(x.laudos_a_certificar>0?'<a class="b g" href="/clinica.html">Certificar o laudo na clínica</a>':'')+'<label><small>Prazo para o paciente</small><select id="pz-'+x.id+'"><option value="1">1 dia</option><option value="2">2 dias</option><option value="3" selected>3 dias</option><option value="5">5 dias</option><option value="7">7 dias</option></select></label><button class="b" data-lt="'+x.id+'">Disparar novo exercício com prazo</button><button class="b g" data-conc="'+x.id+'">OK, concluir sem novas tarefas</button></div>';
  if(x.status==='encaminhado')return '<div class="it"><div class="r"><b>'+esc(x.paciente)+'</b><span class="pill'+(h>=24?' er':'')+'">'+HORAS(h)+'</span></div><small>com '+esc(x.medico||'médico')+'</small>'+(h>=24?'<a class="b g" href="'+WAU(medW(x.medico_id),'Dr(a). '+(x.medico||'')+', o caso de '+x.paciente+' está com você há '+HORAS(h)+'. Consegue devolver à clínica hoje?')+'">Cobrar o médico no WhatsApp</a>':'')+'</div>';
  return ''};
 const prz=f=>{if(f.etapa!=='em_tarefas'||!f.prazo)return '';const ms=new Date(f.prazo)-Date.now(),venc=ms<0,prox=!venc&&ms<24*36e5;return '<small>Prazo: '+new Date(f.prazo).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(venc?' · vencido':prox?' · vence em breve':'')+'</small>'+((venc||prox)?'<a class="b g" href="'+WAU(f.whatsapp||'','Olá, '+f.paciente+'! O prazo dos seus exercícios '+(venc?'venceu':'está acabando')+'. Consegue fazer hoje?')+'">Avisar paciente no WhatsApp</a>':'')};
 const grp=(t,l,vazio)=>'<div class="c"><h3>'+t+' ('+l.length+')</h3>'+(l.length?l.map(casoCard).join(''):'<p>'+vazio+'</p>')+'</div>';
 const outros=fl.filter(f=>['convidado','ativo','em_tarefas','concluido','alta'].includes(f.etapa));
 const fluxo=(P.laudos.pendentes>0?'<div class="alerta"><b>'+P.laudos.pendentes+' laudo(s) aguardando certificação.</b><a class="b" href="/clinica.html" style="margin-top:8px">Conferir e certificar na clínica</a></div>':'')
  +grp('Validar e encaminhar',by('na_clinica'),'Nada esperando validação.')
  +grp('Devolvidos pelo médico: liberar tarefas',by('reavaliar'),'Nenhuma devolução esperando.')
  +grp('Com o médico',by('encaminhado'),'Nenhum caso com médico agora.')
  +'<div class="c"><h3>Acompanhamento ('+outros.length+')</h3>'+(outros.map(f=>'<div class="it"><div class="r"><b>'+esc(f.paciente)+'</b><span class="pill'+(['em_tarefas','ativo','concluido','alta'].includes(f.etapa)?' ok':'')+'">'+({convidado:'convite enviado',ativo:'na ferramenta',em_tarefas:'fazendo tarefas',concluido:'concluído',alta:'alta'})[f.etapa]+'</span></div><small>'+esc(f.medico)+' · '+esc(f.email)+'</small>'+prz(f)+'</div>').join('')||'<p>Nada aqui ainda.</p>')+'</div><div class="msg" id="fxM"></div>';
 const kpis='<div class="c"><h2>'+esc(P.nome)+'</h2><p>Você responde pela sua operação e paga o consumo todo. O usuário nunca é cobrado.</p><div class="kp"><div><b>'+P.saldo+'</b>tokens</div><div><b>'+(P.medicos||[]).length+'</b>médicos</div><div><b>'+P.usuarios+'</b>usuários</div></div><div class="kp"><div><b>'+P.laudos.enviados+'</b>laudos</div><div><b>'+P.laudos.certificados+'</b>certificados</div><div><b>'+P.laudos.pendentes+'</b>a certificar</div></div></div>';
 const medicos='<div class="c"><h3>Habilitar médico por código</h3><p>O médico se qualifica, gera o código no app dele e manda para você. Confira as informações e habilite.</p><input id="hcC" placeholder="MED-XXXX-XXXX" autocapitalize="characters" autocomplete="off"><button class="b g" id="hcB">Conferir o código</button><div id="hcR"></div><div class="msg" id="hcM"></div></div><div class="c"><h3>Convidar um médico</h3><p>O médico abre o app Elayon Médico com o convite e se cadastra. Você aceita aqui e só então ele recebe a ferramenta.</p><input id="mN" placeholder="Nome do médico"><button class="b" id="mB">Gerar convite de médico</button><div id="mR"></div><div class="msg" id="mM"></div></div>'
  +'<div class="c"><h3>Seus médicos</h3>'+(md.map(m=>'<div class="it"><div class="r"><b>'+esc(m.nome)+'</b><span class="pill'+(m.status==='ativo'?' ok':m.status==='recusado'?' er':'')+'">'+(m.status==='pendente'?'aguardando aceite':m.status)+'</span></div><small>'+esc(m.email||'')+' · '+m.pacientes+' paciente(s) · '+m.laudos+' laudo(s)</small>'+(m.status!=='ativo'?'<button class="b" data-dm="'+m.id+'" data-ok="1">Aceitar</button>':'')+(m.status!=='recusado'&&m.id!==ME?'<button class="b g" data-dm="'+m.id+'" data-ok="0">'+(m.status==='ativo'?'Desvincular':'Recusar')+'</button>':'')+'</div>').join('')||'<p>Nenhum ainda.</p>')+'<div class="msg" id="dmM"></div></div>'
  +'<div class="c"><h3>Convites emitidos</h3>'+(cv.map(x=>'<div class="it"><div class="r"><b>'+esc(x.para_nome||x.tipo)+'</b><span class="pill'+(x.usado_em?' ok':'')+'">'+(x.usado_em?'usado':'aberto')+'</span></div><small>'+x.tipo+' · '+esc(x.codigo)+(x.usado_por_nome?' · '+esc(x.usado_por_nome):'')+'</small></div>').join('')||'<p>Nenhum.</p>')+'</div>';
 const clinica='<div class="c"><h3>'+esc((P.clinica||{}).nome||'Sua clínica')+'</h3><p>A clínica é uma aba sua: aqui chegam os laudos dos seus médicos para você conferir e certificar.</p><div class="kp"><div><b>'+P.laudos.pendentes+'</b>a certificar</div><div><b>'+P.laudos.certificados+'</b>certificados</div><div><b>'+P.laudos.enviados+'</b>recebidos</div></div><a class="b" href="/clinica.html">Receber e certificar laudos</a><a class="b g" href="/supervisao.html">Supervisão dos usuários</a></div>'
  +'<div class="c"><h3>Fale com a clínica</h3><p>Com o seu WhatsApp aqui, o app do paciente ganha o botão para falar com a clínica.</p><input id="wZ" type="tel" placeholder="WhatsApp da clínica (com DDD)" value="'+esc((P.clinica||{}).whatsapp||'')+'"><button class="b g" id="wB">Salvar WhatsApp</button><div class="msg" id="wM"></div></div>';
 const consumo=kpis+'<div class="c"><h3>Consumo dos últimos 30 dias</h3><div class="kp"><div><b>'+P.consumo_30d+'</b>tokens</div><div><b>'+v(P.consumo_30d)+'</b>valor</div><div><b>'+P.saldo+'</b>saldo</div></div>'+(P.saldo_baixo?'<div class="alerta">Saldo baixo. Fale com o Advanced para renovar.</div>':'')+'</div><div class="c"><h3>Por médico</h3>'+((P.medicos||[]).map(m=>'<div class="it"><div class="r"><b>'+esc(m.nome)+'</b><b>'+v(m.tokens_30d)+'</b></div><small>'+m.tokens_30d+' tokens dos usuários dele</small></div>').join('')||'<p>Sem consumo.</p>')+'</div>';
 const mais='<div class="c"><h3>Aprender o painel do master</h3><div id="trMs"></div><a class="b g" href="/master-treino.html">Treino completo do master</a></div><div class="c"><h3>Ferramentas</h3><a class="b g" href="/cockpit.html">Cockpit para treinar médicos</a><a class="b g" href="/master.html">Dashboard e metadados</a></div>';
 const ini=Elx.abaSalva((!ia||!reg)?'pf':'fx');
 Elx.abas($('app'),[{id:'fx',t:'Fluxo'+(acoes?' ('+acoes+')':''),html:fluxo},{id:'pc',t:'Pacientes',html:'<div id="mdBox" style="display:grid;gap:12px"></div>'},{id:'md',t:'Médicos'+(md.some(m=>m.status==='pendente')?' •':''),html:medicos},{id:'cl',t:'Clínica',html:clinica},{id:'co',t:'Consumo',html:consumo},{id:'ma',t:'Aprender',html:mais},{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'}],ini);
 if(!ia||!reg)$('pn_fx').insertAdjacentHTML('afterbegin','<div class="alerta"><b>Complete antes de operar:</b> '+(!ia?'a sua IA no Perfil. ':'')+(!reg?'o cadastro profissional. ':'')+'</div>');
 Elx.medicoPainel($('mdBox'),{nome:PF.nome||P.nome,reg:reg,aoMudar:()=>{}});
 Elx.perfil($('pfBox'),{oficial:true,topo:'<div class="c"><h3>Minha ferramenta</h3><p>Atendimento, acompanhamento e retorno de consultas iniciais e de laudos.</p><a class="b" href="/piloto-guiado.html?modo=real">Atender: consulta inicial e laudo</a><a class="b g" href="/espaco-piloto.html">Acompanhamento e retorno: tarefas</a><a class="b g" href="/trilha.html?p=piloto">Treino e calibração</a><a class=\"b g\" href=\"/clinica.html\">Clínica: receber e certificar laudos</a></div>',aoSalvar:()=>setTimeout(()=>painel(),900)});
 Elx.treino($('trMs'),'elx_tr_master',PASSOS);
 const fim=async(fn,args,id,again)=>{try{await rpc(fn,args);painel()}catch(er){const m=$(id);if(m){m.className='msg er';m.textContent=msg(er)}return false}};
 $('pn_fx').onclick=async e=>{const d=e.target.dataset||{};if(d.enc){e.target.disabled=true;if(await fim('master_encaminhar',{p_caso:d.enc,p_medico:$('sel-'+d.enc).value},'fxM')===false)e.target.disabled=false}
  else if(d.conc){if(!confirm('Dar OK e concluir esta etapa?'))return;e.target.disabled=true;if(await fim('master_concluir_caso',{p_caso:d.conc},'fxM')===false)e.target.disabled=false}
  else if(d.lt){e.target.disabled=true;if(await fim('master_liberar_tarefas',{p_caso:d.lt,p_dias:+($('pz-'+d.lt)||{}).value||3},'fxM')===false)e.target.disabled=false}};
 $('pn_md').onclick=async e=>{const id=(e.target.dataset||{}).dm;if(!id)return;e.target.disabled=true;if(await fim('master_decidir_medico',{p_medico:id,p_aceitar:e.target.dataset.ok==='1'},'dmM')===false)e.target.disabled=false};
 $('mB').onclick=async()=>{const n=$('mN').value.trim();if(!n)return;try{const c=await rpc('gerar_convite',{p_tipo:'medico',p_nome:n});const txt='Convite Elayon Médico para '+n+': '+c+'. Abra '+location.origin+'/app-medico.html?c='+c+' e crie o seu acesso. Vale 7 dias.';
  $('mR').innerHTML='<div class="cod">'+esc(c)+'</div><a class="b g" style="margin-top:8px" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Enviar por WhatsApp</a>';$('mM').className='msg ok';$('mM').textContent='Válido por 7 dias, uso único.'}catch(e){$('mM').className='msg er';$('mM').textContent=msg(e)}};
 $('hcB').onclick=async()=>{const cod=$('hcC').value.trim().toUpperCase(),m=$('hcM');m.className='msg';m.textContent='';if(!cod)return;$('hcB').disabled=true;try{const r=await rpc('master_ver_codigo',{p_cod:cod}),pl=r.piloto||{};delete pl.id;
  $('hcR').innerHTML='<div class="it"><div class="r"><b>'+esc(r.nome)+'</b><span class="pill'+(r.treino_ok?' ok':'')+'">'+(r.treino_ok?'treino concluído':'treino pendente')+'</span></div><small>'+esc(r.email||'')+(r.whatsapp?' · '+esc(r.whatsapp):'')+'</small>'+(Object.keys(pl).length?'<div class="qd">'+Object.keys(pl).filter(k=>pl[k]&&typeof pl[k]!=='object'&&!/^(criado|atualizado|created_at|updated_at)$/.test(k)).map(k=>'<small>'+esc(k.replace(/_/g,' '))+'</small><p>'+esc(pl[k])+'</p>').join('')+'</div>':'<small>Cadastro oficial ainda não preenchido.</small>')+(r.status==='ativo'?'<span class="pill ok">já habilitado</span>':'<button class="b" id="hcOk">Habilitar este médico</button>')+'</div>';
  const ok=$('hcOk');if(ok)ok.onclick=async()=>{ok.disabled=true;try{await rpc('master_habilitar_codigo',{p_cod:cod});painel()}catch(e){m.className='msg er';m.textContent=msg(e);ok.disabled=false}}}catch(e){m.className='msg er';m.textContent=msg(e)}$('hcB').disabled=false};
 $('wB').onclick=async()=>{try{await rpc('master_definir_whatsapp',{p_whatsapp:$('wZ').value});$('wM').className='msg ok';$('wM').textContent='Salvo.'}catch(er){$('wM').className='msg er';$('wM').textContent=msg(er)}};
}
</script></body></html>
