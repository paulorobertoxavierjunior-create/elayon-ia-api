<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Médico</title><link rel="manifest" href="/app-medico.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-medico.png"><link rel="icon" href="/icons/icon-medico-192.png"><meta name="theme-color" content="#0b7285"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Médico"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
const PASSOS=[['Seu cadastro oficial','No Perfil, toque em “Cadastro profissional” e informe o seu CRM ou conselho. Sem isso você não gera laudo nem tarefas.'],['A sua IA','No Perfil, coloque a chave da sua própria IA. Ela trabalha no seu nome e a plataforma não cobra por ela.'],['Convidar o paciente','Depois da consulta presencial, na aba Pacientes, cadastre nome e e-mail. O app gera o convite: envie por WhatsApp. O convite só vale para aquele e-mail.'],['Ver a ficha','Quando o paciente entra, ele preenche uma ficha básica e a IA dele. Você lê a ficha antes de agir.'],['Caso chega até você','O paciente usa a ferramenta e envia à clínica. O master valida e encaminha para você. O caso aparece em “Casos com você”.'],['Atender e criar tarefas','Use “Atender e gerar laudo” para o laudo em PDF e “Criar tarefas” para os exercícios. Nada chega ao paciente antes da clínica validar.'],['Devolver à clínica ou dar alta','“Devolver à clínica” envia laudo e tarefas para o master validar e liberar na fila do paciente. “Dar alta” encerra o acompanhamento.']];
Elx.inicia({tipo:'medico',nome:'Elayon Médico',cor:'#0b7285',titulo:'Elayon Médico',frase:'Sua ferramenta de atendimento. O acesso é por convite do seu master.'},async(u)=>{
 const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let vn={status:'sem_vinculo'};try{vn=await rpc('meu_vinculo_medico')}catch(e){}
 const topo='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Olá, doutor(a)</h1><p>Seu consultório digital. Você atende, a clínica valida, o master administra.</p></div>';
 if(vn.status!=='ativo'){
  const M={pendente:['Aguardando o aceite do master','Seu cadastro chegou à '+esc(vn.clinica||'clínica')+'. Assim que o master aceitar, a ferramenta é liberada aqui. Enquanto isso, complete o seu perfil.'],recusado:['Acesso não aceito','O master não aceitou o seu acesso. Fale com ele para entender o motivo.'],sem_vinculo:['Falta o convite do master','Você ainda não está em uma clínica. Peça um convite ao seu master e abra o link que ele enviar.']}[vn.status]||['Acesso','Fale com o seu master.'];
  Elx.abas(A,[{id:'st',t:'Acesso',html:topo+'<div class="c"><h3>'+M[0]+'</h3><p>'+M[1]+'</p><button class="b" onclick="location.reload()">Atualizar</button></div>'},{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'}],'st');
  Elx.perfil($('pfBox'),{oficial:true});return}
 let T={},P={};try{T=await rpc('minha_trilha')}catch(e){}try{const r=await sb.from('profiles').select('nome,ai_key,ai_cfg').eq('id',u.id).maybeSingle();P=r.data||{}}catch(e){}
 const reg=!!T.cadastro_piloto,ia=!!(P.ai_key||Object.keys(P.ai_cfg||{}).some(k=>k[0]!=='_'&&(P.ai_cfg[k]||{}).key));
 const falta=(!reg||!ia)?'<div class="alerta"><b>Complete antes de atender:</b> '+(!ia?'a sua IA no Perfil. ':'')+(!reg?'o cadastro oficial (CRM). ':'')+'</div>':'';
 Elx.abas(A,[{id:'pc',t:'Pacientes',html:topo+falta+'<div id="mdBox" style="display:grid;gap:12px"></div>'},{id:'ap',t:'Aprender',html:'<div class="c"><h3>Como atender no Elayon</h3><div id="trM"></div><a class="b g" href="/trilha.html?p=piloto">Treino completo da ferramenta</a></div>'},{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'}],Elx.abaSalva((!reg||!ia)?'pf':'pc'));
 Elx.medicoPainel($('mdBox'),{nome:P.nome||'seu médico',reg:reg});
 Elx.perfil($('pfBox'),{oficial:true,aoSalvar:()=>setTimeout(()=>location.reload(),900)});
 Elx.treino($('trM'),'elx_tr_medico',PASSOS);
});
</script></body></html>
