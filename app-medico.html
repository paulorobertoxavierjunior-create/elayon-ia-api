<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Médico</title><link rel="manifest" href="/app-medico.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-medico.png"><link rel="icon" href="/icons/icon-medico-192.png"><meta name="theme-color" content="#0b7285"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Médico"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
const PASSOS=[['Seu cadastro oficial','No Perfil, toque em “Cadastro profissional” e informe o seu CRM ou conselho. Sem isso você não gera laudo nem tarefas.'],['A sua IA','No Perfil, coloque a chave da sua própria IA. Ela trabalha no seu nome e a plataforma não cobra por ela.'],['Treino do piloto','Abra “Treino e calibração” em Minha ferramenta e faça a calibração. É a base do laudo e das tarefas.'],['Treino do usuário','Veja o caminho do paciente: ele recebe o seu convite, treina, faz a calibração e pede a sua liberação. Você libera na aba Pacientes.'],['Convidar o paciente','Depois da consulta, na aba Pacientes, cadastre nome e e-mail e envie o convite por WhatsApp. O convite só vale para aquele e-mail.'],['Caso chega até você','O paciente envia à clínica. A clínica confere o cadastro (sem ver o conteúdo) e libera ao seu consultório. O caso aparece em “Casos com você”.'],['Atender, assinar e devolver','Use “Atender e gerar laudo” e “Criar tarefas”. Ao devolver, você assina com nome e registro. A assinatura é sua e é obrigatória.'],['Revisões e atualizações','Se a clínica pedir revisão, ela aparece na aba Pacientes com a justificativa. Responda e assine. Nada chega ao paciente sem a liberação da clínica.']];
Elx.inicia({tipo:'medico',nome:'Elayon Médico',cor:'#0b7285',titulo:'Elayon Médico',frase:'Sua ferramenta de atendimento. O acesso é por convite do seu master.'},async(u)=>{
 const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let CODURL=((location.search.match(/[?&]c=([A-Za-z0-9-]+)/)||[])[1]||'').toUpperCase();try{if(CODURL)localStorage.setItem('elx_cc',CODURL);else CODURL=localStorage.getItem('elx_cc')||''}catch(e){}let vn={status:'sem_vinculo'};try{vn=await rpc('meu_vinculo_medico')}catch(e){}
 const semCl=''+(vn.status==='sem_vinculo'?'<div class="c"><h3>Ainda sem clínica</h3><p>Se um master te convidou, use o código dele no Perfil. Se você quer ser master e ter a sua própria clínica, peça acesso pela mesma conta.</p><a class="b g" href="app-master.html?pedir=1">Pedir acesso de master</a></div>':'');
 const topo=semCl+'<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Olá, doutor(a)</h1><p>Seu consultório digital. Você atende, a clínica valida, o master administra.</p></div>';
 let T={};try{T=await rpc('minha_trilha')}catch(e){}
 if(vn.status!=='ativo'){
  const cad=!!T.cadastro_piloto;
  const M={convidado:['Falta pedir a validação','Você entrou pelo convite da '+esc(vn.clinica||'clínica')+'. Complete o cadastro profissional (CRM ou conselho) no Perfil e peça a validação. O pedido vai para o master da clínica.'],pendente:['Validação pedida','Seu pedido chegou ao master da '+esc(vn.clinica||'clínica')+'. Quando ele liberar a credencial da clínica, você entra no treinamento aqui.'],recusado:['Acesso não liberado','O master não liberou o seu acesso. Fale com ele para entender o motivo.'],sem_vinculo:['Falta o código da clínica','Digite abaixo o código que a clínica te passou. Depois complete o cadastro profissional (CRM) e peça a validação: o master da clínica confere e libera o seu acesso e as credenciais.']}[vn.status]||['Acesso','Fale com o seu master.'];
  const btn=vn.status==='convidado'?'<button class="b" id="pvB"'+(cad?'':' disabled')+'>Pedir validação à clínica</button>'+(cad?'':'<small>Falta o cadastro profissional. Faça no Perfil.</small>')+'<div class="msg" id="pvM"></div>':'';
  Elx.abas(A,[{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'},{id:'st',t:'Acesso',html:topo+'<div class="c"><h3>'+M[0]+'</h3><p>'+M[1]+'</p>'+(vn.status==='sem_vinculo'?'<input id="cdC" autocapitalize="characters" autocomplete="off" placeholder="ECL-XXXXXXXX" value="'+esc(CODURL)+'"><button class="b" id="cdB">Vincular à clínica</button><div class="msg" id="cdM"></div>':'')+btn+'<button class="b g" onclick="location.reload()">Atualizar</button></div>'}],Elx.abaSalva('st'));
  Elx.perfil($('pfBox'),{oficial:true,suporte:'consultorio',aoSalvar:()=>setTimeout(()=>location.reload(),900)});
  const cb=$('cdB');if(cb){const go=async()=>{const v=$('cdC').value.trim();if(!v)return;cb.disabled=true;$('cdM').className='msg';$('cdM').textContent='Vinculando…';try{const r=await rpc('medico_vincular_codigo',{p_codigo:v});if(r&&r.ok===false)throw new Error(r.erro);try{localStorage.removeItem('elx_cc')}catch(x){}location.href='app-medico.html'}catch(e){$('cdM').className='msg er';$('cdM').textContent=MSG[e.message]||msg(e);cb.disabled=false}};cb.onclick=go;if(CODURL)go()}
  const pv=$('pvB');if(pv)pv.onclick=async()=>{pv.disabled=true;try{await rpc('medico_pedir_validacao');location.reload()}catch(e){$('pvM').className='msg er';$('pvM').textContent=msg(e);pv.disabled=false}};return}
 let P={};try{const r=await sb.from('profiles').select('nome,ai_key,ai_cfg').eq('id',u.id).maybeSingle();P=r.data||{}}catch(e){}
 const reg=!!T.cadastro_piloto,ia=!!(P.ai_key||Object.keys(P.ai_cfg||{}).some(k=>k[0]!=='_'&&(P.ai_cfg[k]||{}).key));
 const falta=(!ia)?'<div class="alerta"><b>Complete antes de atender:</b> a sua IA no Perfil.</div>':'';
 const trOk=!!vn.treino;
 Elx.abas(A,[{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'},{id:'pc',t:'Pacientes',html:topo+falta+'<div id="mdCod"></div><div id="mdBox" style="display:grid;gap:12px"></div>'},{id:'ap',t:'Aprender'+(trOk?'':' •'),html:(trOk?'':'<div class="alerta"><b>Comece pelo treinamento.</b> Marque todos os passos para liberar o convite de pacientes.</div>')+'<div class="c"><h3>Como atender no Elayon</h3><div id="trM"></div><div class="msg" id="trMs"></div><a class="b g" href="/trilha.html?p=piloto">Treino e calibração do piloto</a></div>'}],Elx.abaSalva(!trOk?'ap':(!reg||!ia)?'pf':'pc'));
 (async()=>{const bx=$('mdCod');if(!bx)return;try{const r=await rpc('medico_meu_codigo');const c=r.codigo;bx.innerHTML='<div class="c"><h3>Seu código MED</h3><p>Entregue este código ao paciente: no app dele, em "Código do seu médico", ele se liga a você. O mesmo código serve para o master da clínica conferir e habilitar o seu acesso.</p><div class="cod" style="font:800 24px system-ui;letter-spacing:2px;text-align:center;padding:10px;background:#e8f4f1;border-radius:12px">'+esc(c)+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="b g" id="mdCp">Copiar</button><a class="b" href="https://wa.me/?text='+encodeURIComponent('Seu código para ligar a sua conta ao meu acompanhamento no Elayon: '+c+' — entre em '+location.origin+'/app-usuario.html?novo=1')+'">Enviar por WhatsApp</a></div></div>';$('mdCp').onclick=()=>{try{navigator.clipboard.writeText(c);$('mdCp').textContent='Copiado'}catch(e){}}}catch(e){bx.innerHTML=''}})();
 Elx.medicoPainel($('mdBox'),{nome:P.nome||'seu médico',reg:true,treino:true});
 Elx.perfil($('pfBox'),{oficial:true,suporte:'consultorio',topo:'<div class="c"><h3>Minha ferramenta</h3><p>Atendimento, acompanhamento e retorno de consultas iniciais e de laudos.</p><a class="b" href="/piloto-guiado.html?modo=real">Atender: consulta inicial e laudo</a><a class="b g" href="/espaco-piloto.html">Acompanhamento e retorno: tarefas</a><a class="b g" href="/piloto.html">Laudo em PDF para o paciente</a><a class="b g" href="/trilha.html?p=piloto">Treino e calibração</a></div>',aoSalvar:()=>setTimeout(()=>location.reload(),900)});
 const fimT=async()=>{try{const r=await rpc('concluir_treinamento',{p:'medico'});if(r&&r.ok===false)throw new Error(r.erro);location.reload()}catch(e){$('trMs').className='msg er';$('trMs').textContent=msg(e)}};
 const feito=Elx.treino($('trM'),'elx_tr_medico',PASSOS,fimT);if(feito&&!trOk)fimT();
});
</script></body></html>
