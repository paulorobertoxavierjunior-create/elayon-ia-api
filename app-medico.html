<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Médico</title><link rel="manifest" href="/app-medico.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-medico.png"><link rel="icon" href="/icons/icon-medico-192.png"><meta name="theme-color" content="#0b7285"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Médico"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
Elx.inicia({tipo:'medico',nome:'Elayon Médico',cor:'#0b7285',titulo:'Elayon Médico',frase:'Sua ferramenta de atendimento. O acesso é por convite do seu master.'},async(u)=>{
 main()});
const ETP={cadastrado:['a atender',''],aguardando_clinica:['enviado à clínica',''],certificado:['certificado pela clínica','ok'],liberado:['link enviado ao usuário','ok'],usuario_ativo:['usuário ativo','ok'],recusado:['recusado pela clínica','er']};
const dias=h=>h>=48?Math.floor(h/24)+' dias':h>=24?'1 dia':Math.max(0,Math.round(h))+' h';
async function main(){
 const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let vn={status:'sem_vinculo'};try{vn=await rpc('meu_vinculo_medico')}catch(e){}
 const topo='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Olá, doutor(a)</h1><p>Seu consultório digital. Você atende, a clínica avalia, o master administra.</p></div>';
 if(vn.status!=='ativo'){
  const M={pendente:['Aguardando o aceite do master','Seu cadastro chegou à '+esc(vn.clinica||'clínica')+'. Assim que o master aceitar, a ferramenta é liberada aqui. Toque em Atualizar para conferir.'],recusado:['Acesso não aceito','O master não aceitou o seu acesso. Fale com ele para entender o motivo.'],sem_vinculo:['Falta o convite do master','Você ainda não está em uma clínica. Peça um convite ao seu master e abra o link que ele enviar.']}[vn.status]||['Acesso','Fale com o seu master.'];
  A.innerHTML=topo+'<div class="c"><h3>'+M[0]+'</h3><p>'+M[1]+'</p><button class="b" onclick="location.reload()">Atualizar</button></div>';return}
 let T={},ps=[],cz=[];try{T=await rpc('minha_trilha')}catch(e){}try{ps=await rpc('medico_pacientes')}catch(e){}try{cz=await rpc('medico_casos')}catch(e){}
 const ab=cz.filter(x=>x.status==='encaminhado'),reg=!!T.cadastro_piloto;
 const lk=p=>'/piloto-guiado.html?modo=real&pn='+encodeURIComponent(p.paciente)+'&pe='+encodeURIComponent(p.email);
 A.innerHTML=topo
  +(reg?'':'<div class="c"><h3>1. Complete o seu cadastro oficial</h3><p>Informe o seu CRM (ou o registro do seu conselho) para liberar o atendimento.</p><a class="b" href="/cadastro-piloto.html">Fazer meu cadastro oficial</a></div>')
  +'<div class="c"><h3>Cadastrar paciente</h3><p>O paciente já esteve na clínica e recebeu a instrução. Cadastre aqui com o e-mail que ele vai usar no app.</p><input id="pN" placeholder="Nome do paciente"><input id="pE" type="email" placeholder="E-mail do paciente"><input id="pW" type="tel" placeholder="WhatsApp (opcional)"><button class="b" id="pB">Cadastrar e ir ao atendimento</button><div class="msg" id="pM"></div></div>'
  +'<div class="c"><h3>Meus pacientes e laudos ('+ps.length+')</h3>'+(ps.length?ps.map(p=>{const e=ETP[p.etapa]||[p.etapa,''];const at=p.etapa==='cadastrado'&&p.horas>=24;
    return '<div class="it"><div class="r"><b>'+esc(p.paciente)+'</b><span class="pill '+(at?'er':e[1])+'">'+e[0]+(p.etapa==='cadastrado'||p.etapa==='aguardando_clinica'?' · '+dias(p.horas):'')+'</span></div>'
     +(p.etapa==='recusado'&&p.motivo?'<small>Motivo da clínica: '+esc(p.motivo)+'</small>':'')
     +((p.etapa==='cadastrado'||p.etapa==='recusado')?'<a class="b'+(p.etapa==='recusado'?' g':'')+'" href="'+lk(p)+'">'+(p.etapa==='recusado'?'Atender de novo':'Atender')+'</a>':'')+'</div>'}).join(''):'<p>Nenhum paciente ainda. Cadastre o primeiro acima.</p>')+'</div>'
  +'<div class="c"><h3>Casos encaminhados a mim ('+ab.length+')</h3>'+(ab.length?ab.map(x=>'<div class="it"><div class="r"><b>'+esc(x.paciente)+'</b><span class="pill">etapa '+x.ciclo+'</span></div><small>'+(x.resumo&&x.resumo.itens?x.resumo.itens.length+' item(ns) enviado(s)':'exercícios concluídos')+'</small><input id="nt-'+x.id+'" placeholder="Recado para o usuário (opcional)"><div class="r"><button class="b" data-dc="'+x.id+'" data-d="reavaliar">Novos exercícios</button><button class="b g" data-dc="'+x.id+'" data-d="alta">Dar alta</button></div></div>').join(''):'<p>Nenhum caso aguardando você. Depois que o usuário faz os exercícios, o master encaminha o resultado para cá.</p>')+'<div class="msg" id="czM"></div></div>'
  +'<button class="b g" onclick="location.reload()">Atualizar</button><p class="cen hint">Ferramenta de apoio. O diagnóstico e a conduta são sempre do médico.</p>';
 $('pB').onclick=async()=>{const n=$('pN').value.trim(),e=$('pE').value.trim().toLowerCase(),w=$('pW').value.trim(),m=$('pM');m.className='msg';m.textContent='';
  if(!n||!e){m.className='msg er';m.textContent='Digite o nome e o e-mail.';return}
  $('pB').disabled=true;try{await rpc('medico_cadastrar_paciente',{p_nome:n,p_email:e,p_whatsapp:w});location.href=lk({paciente:n,email:e})}catch(er){m.className='msg er';m.textContent=msg(er);$('pB').disabled=false}};
 document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async()=>{const id=b.dataset.dc,d=b.dataset.d,nt=($('nt-'+id)||{}).value||'';document.querySelectorAll('[data-dc]').forEach(x=>x.disabled=true);try{await rpc('medico_decidir',{p_caso:id,p_decisao:d,p_nota:nt});if(d==='alta'){location.reload()}else{$('czM').className='msg ok';$('czM').innerHTML='Registrado. Agora cadastre os novos exercícios no <a href="/piloto.html">painel do paciente</a>: o usuário vê o pedido no app dele.'}}catch(e){$('czM').className='msg er';$('czM').textContent=msg(e);document.querySelectorAll('[data-dc]').forEach(x=>x.disabled=false)}});
}

</script></body></html>
