<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Médico</title><link rel="manifest" href="/app-medico.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-medico.png"><link rel="icon" href="/icons/icon-medico-192.png"><meta name="theme-color" content="#0b7285"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Médico"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
const PASSOS=[['Seu cadastro oficial','No Perfil, toque em “Cadastro profissional” e informe o seu CRM ou conselho. Sem isso você não gera laudo nem tarefas.'],['A sua IA','No Perfil, coloque a chave da sua própria IA. Ela trabalha no seu nome e a plataforma não cobra por ela.'],['Treino do piloto','Abra “Treino e calibração” em Minha ferramenta e faça a calibração. É a base do laudo e das tarefas.'],['Treino do usuário','Veja o caminho do paciente: ele recebe o seu convite, treina, faz a calibração e pede a sua liberação. Você libera na aba Pacientes.'],['Convidar o paciente','Depois da consulta, na aba Pacientes, cadastre nome e e-mail e envie o convite por WhatsApp. O convite só vale para aquele e-mail.'],['Caso chega até você','O paciente envia à clínica. A clínica confere o cadastro (sem ver o conteúdo) e libera ao seu consultório. O caso aparece em “Casos com você”.'],['Atender, assinar e devolver','Use “Atender e gerar laudo” e “Criar tarefas”. Ao devolver, você assina com nome e registro. A assinatura é sua e é obrigatória.'],['Revisões e atualizações','Se a clínica pedir revisão, ela aparece na aba Pacientes com a justificativa. Responda e assine. Nada chega ao paciente sem a liberação da clínica.']];
Elx.inicia({tipo:'medico',nome:'Elayon Médico',cor:'#0b7285',titulo:'Elayon Médico',frase:'Sua ferramenta de atendimento. O acesso é por convite do seu master.'},async(u)=>{
 const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let vn={status:'sem_vinculo'};try{vn=await rpc('meu_vinculo_medico')}catch(e){}
 const topo='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Olá, doutor(a)</h1><p>Seu consultório digital. Você atende, a clínica valida, o master administra.</p></div>';
 let T={};try{T=await rpc('minha_trilha')}catch(e){}
 if(vn.status!=='ativo'){
  const cad=!!T.cadastro_piloto;
  const M={convidado:['Falta pedir a validação','Você entrou pelo convite da '+esc(vn.clinica||'clínica')+'. Complete o cadastro profissional (CRM ou conselho) no Perfil e peça a validação. O pedido vai para o master da clínica.'],pendente:['Validação pedida','Seu pedido chegou ao master da '+esc(vn.clinica||'clínica')+'. Quando ele liberar a credencial da clínica, você entra no treinamento aqui.'],recusado:['Acesso não liberado','O master não liberou o seu acesso. Fale com ele para entender o motivo.'],sem_vinculo:['Falta o convite do master','Você ainda não está em uma clínica. Peça um convite ao seu master e abra o link que ele enviar.']}[vn.status]||['Acesso','Fale com o seu master.'];
  const btn=vn.status==='convidado'?'<button class="b" id="pvB"'+(cad?'':' disabled')+'>Pedir validação à clínica</button>'+(cad?'':'<small>Falta o cadastro profissional. Faça no Perfil.</small>')+'<div class="msg" id="pvM"></div>':'';
  Elx.abas(A,[{id:'st',t:'Acesso',html:topo+'<div class="c"><h3>'+M[0]+'</h3><p>'+M[1]+'</p>'+btn+'<button class="b g" onclick="location.reload()">Atualizar</button></div>'},{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'}],Elx.abaSalva('st'));
  Elx.perfil($('pfBox'),{oficial:true,suporte:'consultorio',aoSalvar:()=>setTimeout(()=>location.reload(),900)});
  const pv=$('pvB');if(pv)pv.onclick=async()=>{pv.disabled=true;try{await rpc('medico_pedir_validacao');location.reload()}catch(e){$('pvM').className='msg er';$('pvM').textContent=msg(e);pv.disabled=false}};return}
 let P={};try{const r=await sb.from('profiles').select('nome,ai_key,ai_cfg').eq('id',u.id).maybeSingle();P=r.data||{}}catch(e){}
 const reg=!!T.cadastro_piloto,ia=!!(P.ai_key||Object.keys(P.ai_cfg||{}).some(k=>k[0]!=='_'&&(P.ai_cfg[k]||{}).key));
 const falta=(!reg||!ia)?'<div class="alerta"><b>Complete antes de atender:</b> '+(!ia?'a sua IA no Perfil. ':'')+(!reg?'o cadastro oficial (CRM). ':'')+'</div>':'';
 const trOk=!!vn.treino;
 Elx.abas(A,[{id:'pc',t:'Pacientes',html:topo+falta+'<div id="mdBox" style="display:grid;gap:12px"></div>'},{id:'ap',t:'Aprender'+(trOk?'':' •'),html:(trOk?'':'<div class="alerta"><b>Comece pelo treinamento.</b> Marque todos os passos para liberar o convite de pacientes.</div>')+'<div class="c"><h3>Como atender no Elayon</h3><div id="trM"></div><div class="msg" id="trMs"></div><a class="b g" href="/trilha.html?p=piloto">Treino e calibração do piloto</a></div>'},{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'}],Elx.abaSalva(!trOk?'ap':(!reg||!ia)?'pf':'pc'));
 Elx.medicoPainel($('mdBox'),{nome:P.nome||'seu médico',reg:reg,treino:trOk});
 Elx.perfil($('pfBox'),{oficial:true,suporte:'consultorio',topo:'<div class="c"><h3>Minha ferramenta</h3><p>Atendimento, acompanhamento e retorno de consultas iniciais e de laudos.</p><a class="b" href="/piloto-guiado.html?modo=real">Atender: consulta inicial e laudo</a><a class="b g" href="/espaco-piloto.html">Acompanhamento e retorno: tarefas</a><a class="b g" href="/piloto.html">Laudo em PDF para o paciente</a><a class="b g" href="/trilha.html?p=piloto">Treino e calibração</a></div>',aoSalvar:()=>setTimeout(()=>location.reload(),900)});
 const fimT=async()=>{try{const r=await rpc('concluir_treinamento',{p:'medico'});if(r&&r.ok===false)throw new Error(r.erro);location.reload()}catch(e){$('trMs').className='msg er';$('trMs').textContent=msg(e)}};
 const feito=Elx.treino($('trM'),'elx_tr_medico',PASSOS,fimT);if(feito&&!trOk)fimT();
});
</script></body></html>
