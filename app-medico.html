<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon Médico</title><link rel="manifest" href="/app-medico.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-medico.png"><link rel="icon" href="/icons/icon-medico-192.png"><meta name="theme-color" content="#0b7285"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Elayon Médico"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><script src="/app-core.js"></script><script>
Elx.inicia({tipo:'medico',nome:'Elayon Médico',cor:'#0b7285',titulo:'Elayon Médico',frase:'Sua ferramenta de atendimento. O acesso é por convite do seu master.'},async(u)=>{
 const A=$('app');A.innerHTML='<div class="c"><p>Carregando…</p></div>';
 let T={},us=[],cz=[];try{T=await rpc('minha_trilha')}catch(e){}try{us=await rpc('meus_usuarios')}catch(e){}try{cz=await rpc('medico_casos')}catch(e){}
 const ab=cz.filter(x=>x.status==='encaminhado');
 const reg=!!T.cadastro_piloto;
 A.innerHTML='<div class="c cen"><img class="logo" src="/icons/logo-emblema.png" alt=""><h1>Olá, doutor(a)</h1><p>Seu consultório digital. Cada um no seu quadrado: você atende, o seu master administra.</p></div>'
  +(reg?'':'<div class="c"><h3>1. Complete o seu cadastro oficial</h3><p>Informe o seu CRM (ou o registro do seu conselho) para liberar a ferramenta.</p><a class="b" href="/cadastro-piloto.html">Fazer meu cadastro oficial</a></div>')
  +'<div class="c"><h3>'+(reg?'Atender':'2. Atender')+'</h3><p>Crie o treino do seu usuário, acompanhe os resultados e emita o laudo para a clínica.</p><a class="b'+(reg?'':' g')+'" href="/piloto.html">Abrir a ferramenta do médico</a></div>'
  +'<div class="c"><h3>Casos encaminhados a mim ('+ab.length+')</h3>'+(ab.length?ab.map(x=>'<div class="it"><div class="r"><b>'+esc(x.paciente)+'</b><span class="pill">etapa '+x.ciclo+'</span></div><small>'+(x.resumo&&x.resumo.itens?x.resumo.itens.length+' item(ns) enviado(s)':'exercícios concluídos')+'</small><input id="nt-'+x.id+'" placeholder="Recado para o usuário (opcional)"><div class="r"><button class="b" data-dc="'+x.id+'" data-d="reavaliar">Novos exercícios</button><button class="b g" data-dc="'+x.id+'" data-d="alta">Dar alta</button></div></div>').join(''):'<p>Nenhum caso aguardando você. O master encaminha aqui o resultado dos usuários vinculados a você.</p>')+'<div class="msg" id="czM"></div></div>'
  +'<div class="c"><h3>Meus usuários ('+us.length+')</h3>'+(us.length?us.map(x=>'<div class="it"><div class="r"><b>'+esc(x.nome)+'</b><span class="pill'+(x.laudos?' ok':'')+'">'+x.laudos+' laudo(s)</span></div><small>desde '+String(x.desde).slice(0,10)+'</small></div>').join(''):'<p>O vínculo nasce sozinho quando você cria o treino ou envia o laudo com o e-mail do usuário, ou convida abaixo.</p>')
  +'<label>Convidar um usuário</label><input id="cvN" placeholder="Nome do usuário"><button class="b g" id="cvB">Gerar convite</button><div id="cvR"></div><div class="msg" id="cvM"></div></div>'
  +'<p class="cen hint">Ferramenta de apoio. O diagnóstico e a conduta são sempre do médico.</p>';
 document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async()=>{const id=b.dataset.dc,d=b.dataset.d,nt=($('nt-'+id)||{}).value||'';document.querySelectorAll('[data-dc]').forEach(x=>x.disabled=true);try{await rpc('medico_decidir',{p_caso:id,p_decisao:d,p_nota:nt});if(d==='alta'){location.reload()}else{$('czM').className='msg ok';$('czM').innerHTML='Registrado. Agora crie os novos exercícios na <a href="/piloto.html">ferramenta do médico</a>: o usuário vê o pedido no app dele.'}}catch(e){$('czM').className='msg er';$('czM').textContent=msg(e);document.querySelectorAll('[data-dc]').forEach(x=>x.disabled=false)}});
 $('cvB').onclick=async()=>{const n=$('cvN').value.trim();if(!n){$('cvM').className='msg er';$('cvM').textContent='Digite o nome.';return}
  try{const c=await rpc('gerar_convite',{p_tipo:'usuario',p_nome:n});const txt='Convite Elayon para '+n+': '+c+' · abra '+location.origin+'/app-usuario.html';
   $('cvR').innerHTML='<div class="cod">'+esc(c)+'</div><a class="b g" style="margin-top:8px" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Enviar por WhatsApp</a>';$('cvM').className='msg ok';$('cvM').textContent='Convite válido por 7 dias, uso único.'}catch(e){$('cvM').className='msg er';$('cvM').textContent=msg(e)}};
});
</script></body></html>
