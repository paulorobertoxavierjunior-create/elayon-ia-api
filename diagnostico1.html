<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elayon Space — Diagnóstico de Fluxo Real</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js">
    <style>
        :root { 
            --bg: #f8fafc; --card-bg: #ffffff; --primary: #0284c7; --primary-hover: #0369a1; 
            --cyan-accent: #06b6d4; --text-main: #1e293b; --text-muted: #64748b; 
            --border: #e2e8f0; --success: #16a34a; --error: #dc2626; --warning: #ca8a04;
            --shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 550px; }
        .card { background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
        h1 { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .subtitle { font-size: 11px; color: var(--cyan-accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 14px; }
        input:focus { outline: none; border-color: var(--primary); background: #fff; }

        .btn { width: 100%; padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; background: var(--primary); color: white; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); }

        .log-box { margin-top: 20px; padding: 16px; background: #f1f5f9; border-radius: 12px; font-size: 13px; color: var(--text-main); line-height: 1.6; border: 1px solid var(--border); }
        .log-success { color: var(--success); font-weight: 600; }
        .log-error { color: var(--error); font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Elayon Space — Validação Tela a Tela</h1>
            <div class="subtitle">Teste de Conexão e Autenticação Real</div>

            <div class="form-group">
                <label>URL do Supabase (Project URL)</label>
                <input type="text" id="supabaseUrl" placeholder="Cole sua SUPABASE_URL da Vercel aqui para teste">
            </div>
            <div class="form-group">
                <label>Chave Anônima (SUPABASE_ANON_KEY)</label>
                <input type="password" id="supabaseKey" placeholder="Cole sua SUPABASE_ANON_KEY aqui">
            </div>
            <div class="form-group">
                <label>E-mail de Teste</label>
                <input type="email" id="testEmail" value="paulorobertoxavierjunior@gmail.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="testPass" value="123456">
            </div>

            <button class="btn" onclick="executarTesteReal()"><i class="fa-solid fa-play"></i> Executar Teste de Login & Cadastro</button>

            <div id="logBox" class="log-box">
                Aguardando parâmetros... Insira as credenciais do seu projeto Supabase para validar a canaleta.
            </div>
        </div>
    </div>

    <script>
        async function executarTesteReal() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            const email = document.getElementById('testEmail').value.trim();
            const password = document.getElementById('testPass').value.trim();
            const logBox = document.getElementById('logBox');

            if (!url || !key) {
                logBox.innerHTML = '<span class="log-error">⚠️ Por favor, informe a URL e a Anon Key do Supabase configuradas no seu painel da Vercel.</span>';
                return;
            }

            logBox.innerHTML = '⏳ Inicializando canaleta com o Supabase...';

            try {
                const client = supabase.createClient(url, key);
                
                logBox.innerHTML = '⏳ Testando tentativa de login para <b>' + email + '</b>...';
                await new Promise(r => setTimeout(r, 1000));

                // Tenta logar diretamente
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    // Se o usuário não existir, tenta criar o cadastro (fluxo completo)
                    logBox.innerHTML = `⚠️ Login retornou: ${error.message}. Tentando registrar o usuário...`;
                    
                    const { data: signUpData, error: signUpError } = await client.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (signUpError) {
                        throw new Error(signUpError.message);
                    } else {
                        logBox.innerHTML = `<span class="log-success">✅ Cadastro realizado com sucesso!<br>Um e-mail de confirmação foi disparado para <b>${email}</b>.<br>Canaleta 100% íntegra e operacional!</span>`;
                    }
                } else {
                    logBox.innerHTML = `<span class="log-success">✅ Login realizado com sucesso absoluto!<br>Sessão ativa para o usuário: <b>${data.user.email}</b><br>Canaleta 100% íntegra e operacional!</span>`;
                }

            } catch (err) {
                logBox.innerHTML = `<span class="log-error">❌ Erro no fluxo: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
