<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elayon</title><link rel="icon" href="/icons/logo-emblema.png"></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app-core.js"></script><script src="/v2-core.js"></script>
<script>
V2.porta({nome:'Elayon',cor:'#2a9d8f',papel:'usuario',titulo:'Bem-vindo ao Elayon',frase:'Crie o seu login para abrir o seu acesso.'},async(u)=>{
 let cod='';try{cod=localStorage.getItem('v2_cod')||''}catch(e){}
 let r=await rpc('c2_entrar_codigo',{p_codigo:cod});
 if(!r.ok){$('app').innerHTML='<div class="c"><h2>'+(r.erro==='codigo_ja_usado'?'Código já usado':'Falta o código')+'</h2><p>'+(r.erro==='codigo_ja_usado'?'Este código já foi ligado a outra conta. Peça um novo à clínica.':'Digite o código que a clínica te passou.')+'</p><input id="xC" autocapitalize="characters" placeholder="PAC-XXXX-XXXX"><button class="b" id="xOk">Entrar com o código</button></div>';
  $('xOk').onclick=()=>{const v=$('xC').value.trim();if(!v)return;try{localStorage.setItem('v2_cod',v.toUpperCase())}catch(e){}location.reload()};return}
 try{localStorage.removeItem('v2_cod')}catch(e){}
 const lib=r.status==='liberado',pend=(r.tarefas||[]).filter(t=>!t.enviado_em),data=d=>new Date(d).toLocaleDateString('pt-BR');
 const mi=(ic,t,tab,soon)=>'<button class="mi" '+(soon?'disabled':'data-go="'+tab+'"')+'><span>'+ic+'</span><b>'+t+'</b>'+(soon?'<i>em breve</i>':'')+'</button>';
 const ini='<div class="c cen"><h1>Olá, '+esc((r.nome||'').split(' ')[0])+'</h1><p>'+esc(r.clinica)+(r.medico?' · '+esc(r.medico):'')+'</p></div><div class="mg">'+mi('📄','Meus registros','rg')+mi('📋','Minhas tarefas'+(pend.length?' ('+pend.length+')':''),'tf')+mi('🎙️','Minha ferramenta','fe')+mi('🩺','Solicitar atendimento','',1)+mi('📅','Agendamentos','',1)+mi('📈','Sessões','',1)+mi('❤️','Sinais vitais','',1)+mi('👤','Meu perfil','pf')+mi('💬','Falar com a clínica','wa')+'</div>';
 const rg=lib&&r.laudo?'<div class="c"><h3>Laudo da sua consulta</h3><small>Validado em '+data(r.laudo.validado_em)+' · '+esc(r.laudo.assinatura||'')+'</small><p style="white-space:pre-wrap;color:var(--ink);font-size:14px">'+esc(r.laudo.texto)+'</p></div>':'<div class="alerta">Seu laudo ainda não foi liberado. Quando o médico validar, ele aparece aqui.</div>';
 const tf=!lib?'<div class="alerta">As tarefas aparecem aqui depois que o médico liberar o seu acesso.</div>':(r.tarefas||[]).length?(r.tarefas||[]).map(t=>'<div class="c"><h3>'+esc(t.titulo)+'</h3><small>'+(t.enviado_em?'Enviada em '+data(t.enviado_em)+' ✓':'Prazo '+data(t.prazo))+'</small>'+(t.orientacao?'<p style="white-space:pre-wrap">'+esc(t.orientacao)+'</p>':'')+(t.enviado_em?'':'<label>Sua resposta ou resultado</label><textarea id="tr_'+t.id+'" rows="4"></textarea><button class="b" data-tid="'+t.id+'">Enviar para a clínica</button><div class="msg" id="tm_'+t.id+'"></div>')+'</div>').join(''):'<div class="c"><small>Nenhuma tarefa por enquanto.</small></div>';
 const fe='<div class="c"><h3>Minha ferramenta</h3><p>'+(r.ferramenta?'Grave a sua fala e observe os seus ritmos e silêncios, com a sua IA. Coloque a sua IA no Perfil antes.':(lib?'Envie primeiro a tarefa pedida pelo médico (aba Tarefas). Depois a ferramenta abre para uso livre.':'A ferramenta abre depois que o médico liberar o seu acesso.'))+'</p>'+(r.ferramenta?'<button class="b" id="fAb">Abrir a ferramenta</button><div id="fBox"></div>':'')+'</div>';
 Elx.abas($('app'),[{id:'pf',t:'Perfil',html:'<div id="pfBox" style="display:grid;gap:12px"></div>'},{id:'in',t:'Início',html:ini},{id:'rg',t:'Registros',html:rg},{id:'tf',t:'Tarefas'+(pend.length?' ('+pend.length+')':''),html:tf},{id:'fe',t:'Ferramenta',html:fe}],'in');
 Elx.perfil($('pfBox'),{oficial:false,anamnese:true});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='wa'){if(r.whatsapp)location.href=V2.wa(r.whatsapp,'Olá, sou '+r.nome+' e queria falar com a clínica.');return}const t=document.querySelector('[data-tb="'+b.dataset.go+'"]');if(t)t.click()});
 document.querySelectorAll('[data-tid]').forEach(b=>b.onclick=async()=>{const id=b.dataset.tid,mm=$('tm_'+id);b.disabled=true;try{await rpc('c2_enviar_tarefa',{p_tarefa:id,p_resposta:$('tr_'+id).value});location.reload()}catch(e){mm.className='msg er';mm.textContent=msg(e);b.disabled=false}});
 const fa=$('fAb');if(fa)fa.onclick=async()=>{try{await rpc('c2_registrar_consumo',{p_acao:'ferramenta_aberta',p_tokens:0})}catch(e){}$('fBox').innerHTML='<iframe src="/cockpit.html" allow="microphone" style="width:100%;height:78vh;border:1px solid var(--l);border-radius:12px;margin-top:8px"></iframe>';fa.hidden=true};
});
</script></body></html>
