<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ELAYON · Analisador Dedicado de Repositório</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 8px; }
        h1 { color: #38bdf8; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 20px; }
        button:hover { background: #0369a1; }
        .file-block { background: #0f172a; border: 1px solid #334155; margin: 15px 0; padding: 15px; border-radius: 6px; }
        .file-path { color: #f43f5e; font-weight: bold; margin-bottom: 8px; }
        pre { white-space: pre-wrap; word-break: break-all; color: #a5b4fc; font-size: 12px; }

        @media print {
            body { background: #ffffff; color: #000000; padding: 0; }
            .container { background: #ffffff; color: #000000; max-width: 100%; padding: 0; border: none; box-shadow: none; }
            button { display: none; }
            .file-block { background: #f8fafc; border: 1px solid #cbd5e1; page-break-inside: avoid; }
            .file-path { color: #0284c7; }
            pre { color: #1e293b; font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="container" id="relatorio-container">
    <h1>ELAYON · Auditoria de Repositório (Sem Login)</h1>
    <p>Mapeamento unificado de códigos, rotas e componentes do ecossistema.</p>
    <button onclick="window.print()">🖨️ Salvar como PDF / Imprimir</button>
    
    <div id="conteudo-arquivos">
        <p style="color: #fbbf24;">A carregar e mapear ficheiros do repositório...</p>
    </div>
</div>

<script>
    // Lista exata baseada na estrutura real fotografada do repositório
    const arquivosRepositorio = [
        // Raiz
        "README.md",
        "admin-action.js",
        "api-silencio.json",
        "app.html",
        "bancada.html",
        "cadastro.html",
        "check-email.html",
        "diagnostic1.html",
        "health.html",
        "index.html",
        "login.html",
        "pc-painel.html",
        "perfil.html",
        "psiq.html",
        "recuperar.html",
        "redefinir.html",
        "vercel.json",
        "vibes.html",
        // Pasta api
        "api/config.js",
        "api/perfil-seguro.js",
        // Pasta app
        "app/ai.js",
        "app/page.tsx",
        "app/perfil-seguro.js",
        "app/calibracao/page.tsx",
        // Pasta components
        "components/CommandBox.tsx"
    ];

    async function carregarRepositorio() {
        const container = document.getElementById("conteudo-arquivos");
        container.innerHTML = "";

        // IMPORTANTE: Substitua 'NOME_EXATO_ DO_REPO' pelo nome exato do repositório atual no seu GitHub
        const nomeRepoAtual = "elayon-crs-triagem"; // Ajuste se for outro repositório
        const baseUrl = `https://raw.githubusercontent.com/paulorobertoxavierjunior-create/${nomeRepoAtual}/main/`;

        let totalCarregados = 0;

        for (const caminho of arquivosRepositorio) {
            try {
                const resposta = await fetch(baseUrl + caminho);
                if (resposta.ok) {
                    const texto = await resposta.text();
                    totalCarregados++;
                    
                    const bloco = document.createElement("div");
                    bloco.className = "file-block";
                    
                    const titulo = document.createElement("div");
                    titulo.className = "file-path";
                    titulo.innerText = `📂 /${caminho}`;
                    bloco.appendChild(titulo);

                    const pre = document.createElement("pre");
                    pre.innerText = texto;
                    bloco.appendChild(pre);
                    container.appendChild(bloco);
                }
            } catch (err) {
                // Ignora ficheiros que não estejam presentes na branch main
            }
        }

        if (totalCarregados === 0) {
            container.innerHTML = "<p style='color: #ef4444;'>Nenhum ficheiro foi carregado. Verifique se o nome do repositório no script corresponde exatamente ao nome no GitHub.</p>";
        }
    }

    carregarRepositorio();
</script>

</body>
</html>
